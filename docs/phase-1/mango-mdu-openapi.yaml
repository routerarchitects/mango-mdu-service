openapi: 3.0.3
info:
  title: Mango MDU Service API
  version: 1.0.0
  description: |
    Northbound API exposed by MDU for Phase 1 workflows.

    Phase 1 Core Scope:
    - Policy Overview orchestration for Operator UI (`GET /api/v1/policies/{policyId}/overview`)
    - Operational System APIs (`/livez`, `/system`)

    Integrations:
    - OWSEC: authentication, token validation, user profile lookup
    - PROV: management policies, management roles, entities, venues

servers:
  - url: /api/v1
    description: Relative API base path

tags:
  - name: System
    description: Operational diagnostics and liveness checks
  - name: Policies
    description: Policy overview and orchestration for operator UI

security:
  - bearerAuth: []

paths:
  /livez:
    servers:
      - url: "https://{host}:{publicPort}"
        description: Public HTTP Port Health Check
        variables:
          host:
            default: localhost
          publicPort:
            default: "16010"
    get:
      tags: [System]
      summary: Liveness probe
      description: Checks if the service is running and healthy. This route is unauthenticated.
      security: []
      responses:
        '200':
          description: Service is healthy and running

  /system:
    servers:
      - url: "https://{host}:{publicPort}/api/v1"
        description: Public HTTP API Interface
        variables:
          host:
            default: localhost
          publicPort:
            default: "16010"
    get:
      tags: [System]
      summary: Retrieve system diagnostics and metrics
      description: Returns system status info or resource usage based on the requested command.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
        - name: command
          in: query
          required: true
          schema:
            type: string
            enum: [info, resources]
      responses:
        '200':
          description: Successful query execution
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '503':
          $ref: '#/components/responses/BackendUnavailableError'
    post:
      tags: [System]
      summary: Modify log levels or query diagnostics schema
      description: Dynamically mutate runtime subsystem log levels or fetch subsystem metadata.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [command]
              properties:
                command:
                  type: string
                  enum: [setloglevel, getloglevels, getloglevelnames, getsubsystemnames]
                subsystems:
                  type: array
                  items:
                    type: object
                    required: [tag, value]
                    properties:
                      tag:
                        type: string
                      value:
                        type: string
      responses:
        '200':
          description: Successful action execution
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '503':
          $ref: '#/components/responses/BackendUnavailableError'

  /policies/{policyId}/overview:
    get:
      tags: [Policies]
      summary: Get Policy Overview
      description: |
        Retrieves live usage summary, metadata, and assigned users for a specific policy.
        Orchestrates data across OWPROV (management policies, management roles, hierarchy) and OWSEC (users).
      operationId: getPolicyOverview
      parameters:
        - name: policyId
          in: path
          required: true
          description: UUID or system identifier of the target policy
          schema:
            type: string
        - $ref: '#/components/parameters/XRequestIdHeader'
        - $ref: '#/components/parameters/XCorrelationIdHeader'
      responses:
        '200':
          description: Policy overview details and usage metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyOverviewResponse'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '503':
          $ref: '#/components/responses/BackendUnavailableError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XRequestIdHeader:
      name: X-Request-Id
      in: header
      required: false
      description: Unique correlation identifier for request tracing
      schema:
        type: string
    XCorrelationIdHeader:
      name: X-Correlation-Id
      in: header
      required: false
      description: Distributed tracing correlation identifier
      schema:
        type: string

  schemas:
    PolicyUsageSummary:
      type: object
      required:
        - usedByUsers
        - scopedAssignmentsCount
        - propertiesCount
        - venuesCount
      properties:
        usedByUsers:
          type: integer
          description: Total number of unique users assigned to this policy
          example: 2
        scopedAssignmentsCount:
          type: integer
          description: Total number of scoped role assignments referencing this policy
          example: 3
        propertiesCount:
          type: integer
          description: Total number of distinct properties (entities) linked to this policy
          example: 1
        venuesCount:
          type: integer
          description: Total number of distinct venues linked to this policy
          example: 2

    AssignedUserSummary:
      type: object
      required:
        - id
        - name
        - email
        - propertyName
        - venueScope
      properties:
        id:
          type: string
          description: User unique identifier (UUID)
          example: "018f3a22-1111-7000-8000-000000000001"
        name:
          type: string
          description: Full display name of the user
          example: "Default User"
        email:
          type: string
          format: email
          description: User email address
          example: "user@example.com"
        propertyId:
          type: string
          description: Entity identifier of the assigned property
          example: "00000000-0000-0000-0000-000000000001"
        propertyName:
          type: string
          description: Display name of the assigned property
          example: "Sunrise Apartments"
        venueId:
          type: string
          description: Venue identifier if assigned to a specific venue
          example: "00000000-0000-0000-0000-000000000002"
        venueScope:
          type: string
          description: Human-readable venue scope name or "Whole property"
          example: "Tower A"

    PolicyOverviewResponse:
      type: object
      required:
        - id
        - name
        - status
        - summary
        - assignedUsers
      properties:
        id:
          type: string
          description: Policy UUID
          example: "523e4567-e89b-12d3-a456-426614174000"
        name:
          type: string
          description: Policy name
          example: "adfcasdfcsacs"
        description:
          type: string
          description: Policy description
          example: "Custom property admin policy"
        status:
          type: string
          description: Operational status of the policy
          example: "Active"
        modified:
          type: integer
          format: int64
          description: Unix epoch timestamp of last modification
          example: 1727610000
        summary:
          $ref: '#/components/schemas/PolicyUsageSummary'
        assignedUsers:
          type: array
          items:
            $ref: '#/components/schemas/AssignedUserSummary'

    ApiError:
      type: object
      required:
        - errorCode
        - errorDescription
      properties:
        errorCode:
          type: integer
          example: 400
        errorDescription:
          type: string
          example: "Bad Request"
        errorDetails:
          type: string
          example: "Invalid policy identifier"

  responses:
    BadRequestError:
      description: Invalid request parameters or malformed input
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnauthorizedError:
      description: Authentication missing, invalid, or expired
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ForbiddenError:
      description: Insufficient permissions to access this policy
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFoundError:
      description: Requested policy not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    BackendUnavailableError:
      description: Downstream dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
