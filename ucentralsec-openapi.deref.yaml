                        - local:
                            process: apply source field updates only for name, description, location, locale, changePassword,
                              suspended, and blackListed
                        - conditional:
                          - when: raw userRole is present and requestedUser.userRole == "root" and callerRole == "admin"
                            sequence:
                            - local:
                                process: return 403 ACCESS_DENIED because ADMIN cannot promote any user to ROOT
                          - when: raw userRole is present and callerRole == "admin" and requestedUser.userRole != "root" and
                              requestedUser.userRole != existingUser.userRole
                            sequence:
                            - local:
                                process: evaluate remaining role-change authorization through ACLProcessor.CanChangeAdminUserRoleTo
                              variables:
                                roleChangeAllowed: ACLProcessor.CanChangeAdminUserRoleTo(callerUser, existingUser, requestedUser.userRole)
                            - conditional:
                              - when: roleChangeAllowed == false
                                sequence:
                                - local:
                                    process: return 403 ACCESS_DENIED
                              - when: roleChangeAllowed == true
                                sequence:
                                - local:
                                    process: assign the requested role to the existing user
                          - when: raw userRole is present and callerRole == "root" and requestedUser.userRole != existingUser.userRole
                            sequence:
                            - local:
                                process: evaluate remaining role-change authorization through ACLProcessor.CanChangeAdminUserRoleTo
                              variables:
                                roleChangeAllowed: ACLProcessor.CanChangeAdminUserRoleTo(callerUser, existingUser, requestedUser.userRole)
                            - conditional:
                              - when: roleChangeAllowed == false
                                sequence:
                                - local:
                                    process: return 403 ACCESS_DENIED
                              - when: roleChangeAllowed == true
                                sequence:
                                - local:
                                    process: assign the requested role to the existing user
                        - local:
                            process: if raw notes is present, append new notes stamped with current time and caller email
                        - local:
                            process: if raw currentPassword is present, validate it and then call AuthService.SetPassword
                              against the loaded user
                        - local:
                            process: if query.email_verification equals the exact string "true", call VerifyEmail(existingUser)
                              and continue regardless of its return value
                        - local:
                            process: if raw userTypeProprietaryInfo is present, run the MFA update branch exactly as coded
                              for sms, authenticator, or email
                        - local:
                            process: if the disabled MFA path is selected, clear authenticatorSecret, clear mobiles, set mfa.enabled=false,
                              and leave the existing mfa.method unchanged
                        - local:
                            process: set existingUser.modified to now
                        - service: postgres
                          type: db
                          schema: ../../db/schema/users.sql
                          action: update
                          condition:
                            id: targetId == db.id
                          input:
                            user: existingUser after source-side mutations
                          output:
                            updated: db.result.success
                        - conditional:
                          - when: updated == false
                            sequence:
                            - local:
                                process: return record not updated
                          - when: updated == true
                            sequence:
                            - service: postgres
                              type: db
                              schema: ../../db/schema/users.sql
                              action: selectOne
                              condition:
                                id: targetId == db.id
                              output:
                                responseUser: db.response
                            - local:
                                process: map db.createdby to response.createdBy, sanitize sensitive fields (currentPassword,
                                  lastPasswords, oauthType), and return the reloaded target user; the handler does not check
                                  whether target reload by id succeeded before serialization
      x-response-shaping:
        transformations:
        - the resetMFA branch returns the sanitized updated target user record reloaded by target id
        - the forgotPassword branch returns the shared OK helper payload with Code, Operation, and Details
        - the normal update branch returns the sanitized updated target user shape reloaded by target id
        - createdBy remains owned by the persisted target user and is never overwritten from the request body
        - sanitization clears currentPassword, lastPasswords, and oauthType before serializing user objects
      x-error-handling:
        local:
          '400':
          - path id is missing or empty
          - the normal-update request body does not parse as UserInfo
          - raw userRole is present but parses as unknown
          - raw currentPassword fails password validation
          - AuthService.SetPassword rejects the new password
          - requested MFA method is invalid
          - SMS MFA is requested while SMS support is disabled
          - email MFA is requested while email MFA support is disabled
          - SMS MFA is requested without a mobile number
          - SMS MFA is requested with a first mobile number that is not valid for the caller email
          - authenticator MFA is requested but the required TOTP verification is incomplete
          - the final update operation reports record-not-updated
          '403':
          - shared authorization fails before handler execution
          - caller role is neither ROOT nor ADMIN and the handler returns ACCESS_DENIED
          - caller role is ADMIN and the target user is ROOT-managed, so the handler returns ACCESS_DENIED
          - caller role is ADMIN and the target user is owned by another caller, so the handler returns ACCESS_DENIED
          - caller role is ADMIN and the requested role change targets ROOT, so the handler returns ACCESS_DENIED
          - ACLProcessor.CanAdminUserManage denies the modify request and the handler returns ACCESS_DENIED
          - ACLProcessor.CanChangeAdminUserRoleTo denies the requested role change and the handler returns ACCESS_DENIED
          '404':
          - the target user does not exist before branching
        downstream:
          passthrough: false
        remap: []
      x-reliability:
