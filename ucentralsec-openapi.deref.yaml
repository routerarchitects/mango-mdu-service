  /systemSecret/{secret}:
    get:
      tags:
      - System Secrets
      summary: Read one system secret, all stored secrets, or the fixed known-key dictionary.
      description: 'Returns one of three source-defined `GET` branches in this order:


        1. `all=true`: return every stored secret as `{ "secrets": [...] }`.

        2. `dictionary=true`: return the hard-coded known-key dictionary as `{ "knownKeys": [...] }`.

        3. Otherwise: return one `{ "key", "value" }` pair for the path secret.


        The `all` and `dictionary` branches ignore the path `{secret}` value entirely.

        '
      operationId: getSystemSecret
      parameters:
      - in: path
        name: secret
        required: true
        description: Secret key used only by the single-secret lookup branch. The `all` and `dictionary` branches ignore this
          path value.
        schema:
          type: string
      - in: query
        name: all
        required: false
        description: Only exact lowercase `true` selects the full-store listing branch. This branch takes precedence over
          `dictionary=true`.
        schema:
          type: boolean
          default: false
      - in: query
        name: dictionary
        required: false
        description: Only exact lowercase `true` selects the hard-coded known-key dictionary branch when `all` is not also
          exactly true.
        schema:
          type: boolean
          default: false
      x-actor:
        type: authenticated-root-or-internal
        roles:
        - root
        note: The constructor uses the shared automatic authorization path. After that, `GET` allows internal-mode bypass
          but otherwise requires the authenticated caller role to be `root`.
      x-validation:
        common:
        - authentication is required by the shared handler path before `DoGet()` executes
        - for non-internal requests, the authenticated caller role must be `root`
        - only exact lowercase `true` activates `all` and `dictionary`
        branching:
        - when `all=true`, that branch executes first even if `dictionary=true` is also present
        - the `all` and `dictionary` branches do not validate or use the path `secret`
        - the single-secret branch requires a non-empty bound path secret
      x-processing:
        sequence:
        - conditional:
          - when: internalMode != true and caller.userRole != root
            sequence:
            - local:
                process: return access denied
          - when: internalMode == true or caller.userRole == root
            sequence:
            - conditional:
              - when: query.all parses as true
                sequence:
                - local:
                    process: copy the full in-memory secret store map returned by `SecretStore()->Store()`
                  variables:
                    store: local.result.store
                - local:
                    process: 'convert each key-value pair into an object with exactly `key` and `value`, append them to `secrets`,
                      and return `{ "secrets": [...] }`'
              - when: query.all does not parse as true and query.dictionary parses as true
                sequence:
                - local:
                    process: return the hard-coded `knownKeys` list containing the current source entries for `google.maps.apikey`,
                      `iptocountry.ipinfo.token`, `iptocountry.ipdata.apikey`, and `iptocountry.ip2location.apikey`
              - when: neither listing branch matched
                sequence:
                - local:
                    process: read the bound path secret key
                  variables:
                    key: path.secret
                - conditional:
                  - when: key is empty
                    sequence:
                    - local:
                        process: return missing or invalid parameters
                  - when: key is not empty
                    sequence:
                    - local:
                        process: call `SecretStore()->Get(key, value, "")`
                      variables:
                        found: local.result.success
                        value: local.result.value
                    - conditional:
                      - when: found == true
                        sequence:
                        - local:
                            process: 'return `{ "key": key, "value": value }`'
                      - when: found == false
                        sequence:
                        - local:
                            process: return not found
      x-response-shaping:
        transformations:
        - 'the `all` branch returns `{ "secrets": [ { "key", "value" }, ... ] }`'
        - 'the `dictionary` branch returns `{ "knownKeys": [ { "key", "description" }, ... ] }`'
        - the single-secret branch returns one `{ "key", "value" }` object
        - the current source exposes secret values directly in successful `GET` responses
      x-error-handling:
        local:
          '400':
          - neither listing branch matched and the bound path secret is empty
          '403':
          - shared authorization fails before handler execution
          - a non-internal caller is not root
          '404':
          - the single-secret branch key does not exist in the secret store
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The handler reads only the in-memory `SecretStore` state. The known-key dictionary branch is entirely hard-coded
          inside the handler method.
      responses:
        '200':
          description: System secret data returned successfully.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - key
                  - value
                  properties:
                    key:
                      type: string
                    value:
                      type: string
                - type: object
                  additionalProperties: false
                  required:
                  - secrets
                  properties:
                    secrets:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - key
                        - value
                        properties:
                          key:
                            type: string
                          value:
                            type: string
                - type: object
                  additionalProperties: false
                  required:
                  - knownKeys
                  properties:
                    knownKeys:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - key
                        - description
                        properties:
                          key:
                            type: string
                          description:
                            type: string
              examples:
                singleSecret:
                  value:
                    key: google.maps.apikey
                    value: secret-value
                allSecrets:
                  value:
                    secrets:
                    - key: google.maps.apikey
                      value: secret-value
                    - key: iptocountry.ipinfo.token
                      value: another-secret
                dictionary:
                  value:
                    knownKeys:
                    - key: google.maps.apikey
                      description: A Google Key specific for the Google MAPS API.
                    - key: iptocountry.ipinfo.token
                      description: IPInfo.io service token.
        '400':
          description: Missing or invalid parameters for the single-secret lookup branch.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '403':
          description: Authentication failed or caller is not allowed to read system secrets.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '404':
          description: Secret key not found.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
    put:
      tags:
      - System Secrets
      summary: Create or replace one system secret entry.
      description: 'Stores one secret value in `SecretStore`.


        The source reads the secret key from the path and the secret value from the `value` query parameter. There is no request
        body for this operation.

        '
      operationId: putSystemSecret
      parameters:
      - in: path
        name: secret
        required: true
        description: Secret key to create or replace.
        schema:
          type: string
      - in: query
        name: value
        required: true
        description: Secret value. The source uses the sentinel string `_______no_value_____` to detect omission, so supplying
          that exact string is treated as missing.
        schema:
          type: string
      x-actor:
        type: authenticated-root
        roles:
        - root
        note: The constructor uses the shared automatic authorization path. After that, `PUT` requires the authenticated caller
          role to be `root`; internal mode does not bypass this check in the copied source.
      x-idempotency:
        enabled: true
        mode: replace
        note: Repeating the same `secret` and `value` pair overwrites the same store entry with the same resulting state,
          although the underlying store file is rewritten each time.
      x-validation:
        common:
        - authentication is required by the shared handler path before `DoPut()` executes
        - the authenticated caller role must be `root`
        - the bound path secret must be non-empty
        - the `value` query parameter must be present and must not equal the source sentinel `_______no_value_____`
      x-processing:
        sequence:
        - conditional:
          - when: caller.userRole != root
            sequence:
            - local:
                process: return access denied
        - local:
            process: read the bound path secret and the `value` query parameter using the source sentinel default
          variables:
            key: path.secret
            value: query.value default "_______no_value_____"
        - conditional:
          - when: key is empty or value equals "_______no_value_____"
            sequence:
            - local:
                process: return missing or invalid parameters
          - when: key is not empty and value does not equal "_______no_value_____"
            sequence:
            - local:
                process: 'call `SecretStore()->Set(key, value)` and then return `{ "key": key, "value": value }`'
      x-response-shaping:
        transformations:
        - successful responses return one `{ "key", "value" }` object
        - the response echoes the submitted secret value directly
      x-error-handling:
        local:
          '400':
          - the bound path secret is empty
          - the `value` query parameter is missing
          - the `value` query parameter equals the source sentinel string `_______no_value_____`
          '403':
          - shared authorization fails before handler execution
          - the caller is not root
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: '`SecretStore()->Set(...)` mutates the in-memory store and immediately rewrites the persisted secrets file through
          `SaveStore()`. The handler does not expose a separate persistence failure branch.'
      responses:
        '200':
          description: System secret stored successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - key
                - value
                properties:
                  key:
                    type: string
                  value:
                    type: string
        '400':
          description: Missing or invalid secret key or value.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '403':
          description: Authentication failed or caller is not root.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
    delete:
      tags:
      - System Secrets
      summary: Remove one system secret entry.
      description: Deletes one secret key from `SecretStore`.
