      description: Logs out the current session only when the bearer token extracted from the Authorization header exactly
        matches the `{token}` path parameter.
      operationId: deleteSubscriberOauth2Token
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
      x-actor:
        type: bearer-token-caller
        roles: []
        note: This branch does not use the shared authorization helper. It parses the Authorization header locally and compares
          the bearer token with the path token.
      x-idempotency:
        enabled: true
        mode: delete
        keyFields:
        - path.token
        onRepeat:
          stateChange: the source repeats local logout work and still returns 204 when the same bearer token is supplied again
        note: The source does not verify that the bearer token is still active before calling `SubLogout`; it only requires
          header extraction to succeed and the path token to match the bearer token string.
      x-validation:
        common:
        - the Authorization header must parse as OAuth20 Bearer credentials
        - '`path.token` must be non-empty'
        - '`path.token` must exactly match the bearer token string'
      x-processing:
        sequence:
        - local:
            process: extract OAuth20 bearer credentials from the Authorization header
          variables:
            pathToken: path.token
            bearerToken: request.authorization.bearer
            bearerExtractionSucceeded: local.result.success
        - conditional:
          - when: bearerExtractionSucceeded == false
            sequence:
            - local:
                process: return bad request with missing-or-invalid-parameters
          - when: bearerExtractionSucceeded == true and (pathToken is empty or pathToken != bearerToken)
            sequence:
            - local:
                process: return bad request with missing-or-invalid-parameters
          - when: bearerExtractionSucceeded == true and pathToken is not empty and pathToken == bearerToken
            sequence:
            - local:
                process: call `AuthService()->SubLogout(pathToken)`
            - local:
                process: return HTTP 204 no content
      x-response-shaping:
        transformations:
        - successful logout returns no response body
      x-error-handling:
        local:
          '400':
          - bearer Authorization parsing throws an exception
          - '`path.token` is empty'
          - '`path.token` does not match the bearer token'
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: Successful logout does not depend on prior token validation; it depends only on local bearer extraction and
