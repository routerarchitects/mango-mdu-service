                - local:
                    process: allow delete because ROOT can delete any loaded admin-user
                  variables:
                    explicitDeleteAllowed: true
              - when: callerRole == "admin" and targetUser.userRole == "root"
                sequence:
                - local:
                    process: return 403 ACCESS_DENIED because ADMIN cannot delete ROOT users
              - when: callerRole == "admin" and targetUser.id == callerId
                sequence:
                - local:
                    process: return 403 ACCESS_DENIED because ADMIN self-delete is denied
              - when: callerRole == "admin" and targetUser.createdBy is empty
                sequence:
                - local:
                    process: return 403 ACCESS_DENIED because ADMIN cannot delete ROOT-managed legacy rows
              - when: callerRole == "admin" and targetUser.createdBy != callerId
                sequence:
                - local:
                    process: return 403 ACCESS_DENIED because ADMIN cannot delete users created by another caller
              - when: callerRole == "admin" and targetUser.createdBy == callerId
                sequence:
                - local:
                    process: allow delete because ADMIN owns the target through createdBy
                  variables:
                    explicitDeleteAllowed: true
            - conditional:
              - when: explicitDeleteAllowed == true
