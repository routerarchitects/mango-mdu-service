                selectedUserFound: db.response exists
            - conditional:
              - when: selectedUserFound == false
                sequence:
                - local:
                    process: skip the selected id and continue iteration
              - when: selectedUserFound == true
                sequence:
                - conditional:
                  - when: callerRole == "root"
                    sequence:
                    - local:
                        process: allow read because ROOT can retrieve any loaded admin-user
                    - local:
                        process: evaluate admin-user read authorization through ACLProcessor.CanAdminUserManage
                      variables:
                        selectedAllowed: ACLProcessor.CanAdminUserManage(callerUser, selectedUser, READ)
                    - conditional:
                      - when: selectedAllowed == false
                        sequence:
                        - local:
                            process: skip unauthorized selected user and continue iteration
                      - when: selectedAllowed == true
                        sequence:
                        - local:
                            process: map db.createdby to selectedUser.createdBy, sanitize sensitive fields (currentPassword,
                              lastPasswords, oauthType), and append selectedUser to authorizedUsers
                  - when: callerRole == "admin" and selectedUser.createdBy is non-empty and selectedUser.createdBy == callerId
                    sequence:
                    - local:
                        process: allow read because ADMIN owns the target through createdBy
                    - local:
                        process: evaluate admin-user read authorization through ACLProcessor.CanAdminUserManage
                      variables:
                        selectedAllowed: ACLProcessor.CanAdminUserManage(callerUser, selectedUser, READ)
                    - conditional:
                      - when: selectedAllowed == false
                        sequence:
                        - local:
                            process: skip unauthorized selected user and continue iteration
                      - when: selectedAllowed == true
                        sequence:
                        - local:
                            process: map db.createdby to selectedUser.createdBy, sanitize sensitive fields (currentPassword,
                              lastPasswords, oauthType), and append selectedUser to authorizedUsers
                  - when: callerRole == "admin" and (selectedUser.createdBy is empty or selectedUser.createdBy != callerId)
                    sequence:
                    - local:
                        process: skip unauthorized selected user and continue iteration
            - local:
                process: complete iteration and expose authorized users in original lookup order
              variables:
                users: authorizedUsers
                loaded: true
        - conditional:
          - when: selectedIds is empty and loaded == true
            sequence:
            - local:
                process: map db.createdby to user.createdBy and sanitize sensitive fields (currentPassword, lastPasswords,
                  oauthType) on each returned user
          - when: selectedIds is empty and loaded == false
            sequence:
            - local:
                process: continue with an empty in-memory UserInfoList
        - conditional:
          - when: selectedIds is empty and idOnly == true
            sequence:
            - local:
                process: return a JSON object containing users as an array of only the sanitized user id values
          - when: selectedIds is empty and idOnly != true
            sequence:
            - local:
                process: serialize and return the full sanitized admin-user list shape
          - when: selectedIds is not empty
            sequence:
            - local:
                process: serialize and return the full sanitized admin-user list shape
      x-response-shaping:
        transformations:
        - ROOT callers receive all matching users within the existing select or paged-list behavior
        - ADMIN callers receive only users whose createdBy matches the authenticated caller id
        - legacy admin-user rows with empty or null createdBy remain visible only to ROOT callers until ownership is backfilled
        - the normal paged list branch returns either a full sanitized UserInfoList object or an object with users as an array
          of strings when idOnly=true
        - the select branch always returns the full sanitized UserInfoList object and ignores idOnly
        - sanitization clears currentPassword, lastPasswords, and oauthType before serializing user objects
        - missing ids and unauthorized ids in the select branch are omitted rather than producing an error
      x-error-handling:
        local:
          '403':
          - shared authorization fails before handler execution
          - caller role is neither ROOT nor ADMIN and the handler returns ACCESS_DENIED
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The handler does not convert UserDB.GetUsers failure into an HTTP error; it returns an empty list instead.
      responses:
        '200':
          description: Authorized selected user records or authorized paged user list returned successfully, including the
            source-defined empty-array fallback on paginated DB failure.
          content:
            application/json:
              schema:
                oneOf:
                - description: Response shape that returns only user id values for the authorized `/users` result set.
                  type: object
                  additionalProperties: false
                  required:
                  - users
                  properties:
                    users:
                      description: Authorized user ids in response order.
                      type: array
                      items:
                        type: string
                - description: Response shape that returns full sanitized user records for the authorized `/users` result
                    set.
                  type: object
                  additionalProperties: false
                  required:
                  - users
                  properties:
                    users:
                      description: Authorized sanitized user records in response order.
                      type: array
                      items:
                        description: Sanitized admin-user response shape for `/user/{id}` and `/users`, including ownership
                          metadata.
                        type: object
                        additionalProperties: false
                        required:
                        - id
