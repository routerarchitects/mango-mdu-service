  /validateApiKey:
    get:
      tags:
      - API Key Validation
      summary: Validate an OWSEC API key.
      description: Validates the `apikey` query parameter against the local API-key store and returns the serialized `UserInfoAndPolicy`
        payload with a top-level `expiresOn` field. In the inspected source, absence of any `apikey` query parameter returns
        HTTP 404, suspended linked users return HTTP 403 with `ACCOUNT_SUSPENDED`, and all other validation failures return
        HTTP 403 with `ACCESS_DENIED`.
      operationId: validateApiKey
      security: []
      parameters:
      - in: query
        name: apikey
        required: true
        description: API key value to validate.
        schema:
          type: string
      x-actor:
        type: anonymous-or-internal
        roles: []
        note: 'The handler declares `security: []` and validates API keys supplied through raw query parameters rather than
          through the shared authenticated-caller path.'
      x-validation:
        common:
        - the handler scans the raw query-parameter list and only acts when it finds a parameter whose name is exactly `apikey`
        - the supplied API key must resolve through `AuthService()->IsValidApiKey(...)`
        apiKeyState:
        - suspended linked users produce the distinct account-suspended branch
        - other invalid states, including missing records and expired keys, collapse into the generic access-denied branch
      x-processing:
        sequence:
        - local:
            process: parse the request URI and iterate query parameters in order until a parameter named `apikey` is found
          variables:
            candidateApiKey: first query parameter named apikey
        - conditional:
          - when: candidateApiKey exists
            sequence:
            - service: auth-service
              type: local-service
              endpoint: IsValidApiKey
              method: GET
              requestMapping:
                apiKey: candidateApiKey
              variables:
                apiKeyValid: service.result.success
                tokenInfo: service.result.webtoken
                userInfo: service.result.userinfo
                expired: service.result.expired
                expiresOn: service.result.expiresOn
                suspended: service.result.suspended
            - conditional:
              - when: apiKeyValid == true
                sequence:
                - local:
                    process: serialize `UserInfoAndPolicy` using the returned `webtoken` and `userinfo`, then add a top-level
                      `expiresOn` field to the response object
              - when: apiKeyValid == false and suspended == true
                sequence:
                - local:
                    process: return unauthorized with the ACCOUNT_SUSPENDED error payload
              - when: apiKeyValid == false and suspended != true
                sequence:
                - local:
                    process: return unauthorized with the ACCESS_DENIED error payload
          - when: candidateApiKey does not exist
            sequence:
            - local:
                process: return not found
      x-response-shaping:
        transformations:
        - return a JSON object with top-level `tokenInfo`, `userInfo`, and `expiresOn`
        - '`tokenInfo` is serialized from `WebToken::to_json`'
        - '`userInfo` is serialized from `UserInfo::to_json`'
        - '`expiresOn` is copied from the out-parameter populated by `IsValidApiKey(...)`'
      x-error-handling:
        local:
          '403':
          - the API key is invalid
          - the API key is expired
          - the linked user is suspended, in which case the handler emits ACCOUNT_SUSPENDED instead of ACCESS_DENIED
          '404':
          - no query parameter named `apikey` was present in the request URI
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: Successful validation updates the stored API-key `lastUse` timestamp inside `AuthService::IsValidApiKey(...)`
          before the response is returned.
      responses:
        '200':
          description: API key is valid and the linked user context was returned.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - tokenInfo
                - userInfo
                - expiresOn
                properties:
                  tokenInfo:
                    type: object
                    description: Serialized `WebToken`. In the inspected API-key validation path this may contain serializer
                      defaults rather than an independently loaded bearer token.
                    properties:
                      access_token:
                        type: string
                      refresh_token:
                        type: string
                      token_type:
                        type: string
                      expires_in:
                        type: integer
                        format: int64
                      idle_timeout:
                        type: integer
                        format: int64
                      created:
