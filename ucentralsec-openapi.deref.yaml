  /subavatar/{id}:
    get:
      tags:
      - Subscriber Avatars
      summary: Download one subscriber avatar.
      description: 'Returns the stored subscriber avatar blob found in the authenticated caller''s subscriber-avatar namespace
        for the requested path ID.


        The response Content-Type is inferred from the stored avatar filename and the response is returned as downloadable
        file content.

        '
      operationId: getSubscriberAvatar
      parameters:
      - in: path
        name: id
        required: true
        description: Avatar record ID looked up together with the authenticated caller email. This is not a global "download
          any subscriber UUID" lookup.
        schema:
          type: string
      x-actor:
        type: authenticated-user
        roles: []
        note: any authenticated caller; the current source does not enforce owner-or-root authorization for GET
      x-validation:
        common:
        - authentication is required
        - path id must be present
        access:
        - the current GET implementation does not perform owner-or-root authorization beyond authentication
      x-processing:
        sequence:
        - local:
            process: read the target subscriber avatar ID from the path and use it with the authenticated caller email for
              lookup
          variables:
            targetAvatarId: path.id
        - local:
            process: reject the request when targetAvatarId is empty
        - service: postgres
          type: db
          schema: ../../db/schema/subavatars.sql
          action: selectOne
          condition:
            id: path.id == db.id
          output:
            avatarContent: db.response.avatar
            avatarType: db.response.type
            avatarName: db.response.name
            avatarFound: db.response exists
        - conditional:
          - when: avatarFound == false
            sequence:
            - local:
                process: return not found
          - when: avatarFound == true
            sequence:
            - local:
                process: return the raw avatar content as a downloadable file, deriving the response media type from avatarName
                  rather than the stored avatarType field
      x-response-shaping:
        transformations:
        - return the raw avatar bytes as the response body
        - expose Content-Disposition with attachment filename equal to the stored avatar name
        - derive the HTTP Content-Type from the stored avatar name using media-type inference, not from the stored avatarType
          field
      x-error-handling:
        local:
          '404':
          - path id is missing
          - no subscriber avatar record exists for the requested id
          '403':
          - authentication fails before handler execution
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      responses:
        '200':
          description: Subscriber avatar downloaded successfully. The concrete media type is inferred from the stored filename;
            common image media types are listed and application/octet-stream remains the fallback binary shape.
          headers:
            Content-Disposition:
              description: Attachment filename equal to the stored avatar name.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Authentication failed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '404':
          description: Subscriber avatar not found.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
    post:
      tags:
      - Subscriber Avatars
      summary: Upload or replace the authenticated subscriber avatar.
      description: 'Uploads one avatar blob for the authenticated caller into the subscriber-avatar store.


        The path `{id}` is accepted by routing, but the upload is stored under the authenticated caller''s own user ID.


        Multipart request note: the contract does not require a fixed multipart field name. Upload acceptance depends on the
        final captured multipart part name being non-empty and the accumulated uploaded byte length being smaller than the
        configured max size.

        '
      operationId: uploadSubscriberAvatar
      parameters:
      - in: path
        name: id
        required: true
        description: Path segment required by routing. The current source ignores this value during POST and stores the avatar
          under the authenticated caller's user ID instead.
        schema:
          type: string
      requestBody:
        required: false
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
              description: The handler reads the multipart body through Poco::Net::HTMLForm and consumes the uploaded bytes
                from the part handler stream.
      x-actor:
        type: authenticated-user
        roles: []
        note: authenticated caller uploading their own subscriber avatar; path id is ignored for storage
      x-validation:
        common:
        - authentication is required
        - the final captured multipart part name must be non-empty
        - uploaded avatar length must be smaller than `openwifi.avatar.maxsize`, which defaults to 2000000 bytes
        sourceSpecific:
        - POST ignores path id and always uses the authenticated caller's own user id for storage
        - multipart parts are consumed through `HTMLForm`, their bytes are accumulated into one handler stream, and the final
          captured part name/content type together with the accumulated length drive upload acceptance
      x-processing:
        sequence:
        - local:
            process: resolve the authenticated caller user id and parse the multipart body through SubAvatarPartHandler, accumulating
              uploaded bytes into one stream while the final captured part name and content type are retained
          variables:
            storedAvatarId: token.userinfo.id
            multipartPartName: local.result.partName
            multipartContentType: local.result.contentType
            avatarBytes: local.result.avatarBytes
            avatarLength: local.result.avatarLength
        - conditional:
          - when: multipartPartName is empty or avatarLength is greater than or equal to configured avatar max size
            sequence:
            - local:
                process: return a JSON object containing avatarId equal to the authenticated caller id, errorCode 13, and
                  errorText "Avatar upload could not complete."
          - when: multipartPartName is not empty and avatarLength is smaller than configured avatar max size
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/subavatars.sql
              action: upsert
              condition:
                id: token.userinfo.id == db.id
              input:
                id: storedAvatarId
                type: multipartContentType
                created: current time
                name: multipartPartName
                avatar: avatarBytes
            - service: postgres
              type: db
              schema: ../../db/schema/subscribers.sql
              action: update
              condition:
                id: token.userinfo.id == db.id
              input:
                avatar: current unix timestamp string
            - local:
                process: return a JSON object containing avatarId equal to the authenticated caller id and errorCode 0 without
                  checking whether the subscriber-avatar blob write or subscriber avatar-flag update reported success
      x-response-shaping:
        transformations:
        - return a JSON status object rather than the avatar metadata itself
        - on success, return `avatarId` and `errorCode: 0`
        - on upload rejection, return `avatarId`, `errorCode: 13`, and `errorText` with HTTP 200
      x-error-handling:
        local:
          '403':
          - authentication fails before handler execution
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The success response is driven only by multipart-name presence and size validation. The current source does
          not branch on SubAvatarDB().SetAvatar or SubDB().SetAvatar return values before returning errorCode 0.
      x-idempotency:
        enabled: false
        mode: update
        note: Repeated successful uploads overwrite the stored subscriber avatar content and update the subscriber avatar
          flag. The operation is not idempotent with respect to stored blob bytes or upload time.
      responses:
        '200':
          description: Subscriber avatar upload result returned successfully. Upload rejections such as empty multipart part
            name or avatar size over the configured limit are represented as errorCode 13 in this JSON body, still with HTTP
            200.
          content:
            application/json:
              schema:
                type: object
                description: Result body returned by avatar upload handlers, including successful uploads and upload rejections
                  represented as HTTP 200 payloads.
                additionalProperties: false
                required:
                - avatarId
                - errorCode
                properties:
                  avatarId:
                    type: string
                    format: uuid
                    description: Avatar identifier generated or returned by the upload handler.
                  errorCode:
                    type: integer
                    description: Source-defined upload result code; zero indicates success.
                  errorText:
                    type: string
                    description: Optional source-defined error text for rejected uploads.
              examples:
                success:
                  value:
                    avatarId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                    errorCode: 0
                rejected:
                  value:
                    avatarId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                    errorCode: 13
                    errorText: Avatar upload could not complete.
        '403':
          description: Authentication failed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
    delete:
      tags:
      - Subscriber Avatars
      summary: Delete one subscriber avatar.
      description: Deletes the stored subscriber avatar for the requested user ID. Only root or the same user can delete the
        avatar in the current source.
      operationId: deleteSubscriberAvatar
      parameters:
      - in: path
        name: id
        required: true
        description: Subscriber user UUID whose avatar should be deleted.
        schema:
          type: string
      x-actor:
        type: authenticated-user
        roles: []
        note: authenticated root user deleting any subscriber avatar, or authenticated user deleting their own subscriber
          avatar
      x-validation:
        common:
        - authentication is required
        - caller must be root or must match the path id
      x-processing:
        sequence:
        - local:
            process: read the target subscriber avatar ID from the path and compare it with the authenticated caller
          variables:
            targetAvatarId: path.id
            callerUserUuid: token.userinfo.id
            callerRole: token.userinfo.userRole
        - local:
            process: reject the request when the caller is neither root nor the same user
        - service: postgres
          type: db
          schema: ../../db/schema/subavatars.sql
          action: delete
          condition:
            id: path.id == db.id
          output:
            deleteSucceeded: db.result.success
        - conditional:
          - when: deleteSucceeded == false
            sequence:
            - local:
                process: return not found
          - when: deleteSucceeded == true
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/subscribers.sql
              action: update
              condition:
                id: path.id == db.id
              input:
                avatar: '0'
      x-response-shaping:
        transformations:
        - return the shared empty DELETE success response body used by RESTAPIHandler::OK on successful deletion
      x-error-handling:
        local:
          '403':
          - caller is neither root nor the same user identified by the path id
          '404':
          - no subscriber avatar record exists for the requested id
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      x-idempotency:
        enabled: true
        mode: delete
        keyFields:
        - path.id
        onRepeat:
          stateChange: none after the first successful deletion
          returnsNotFound: true
        note: A repeated DELETE against the same already-deleted subscriber avatar converges on the same backend state but
          returns not found in the current source.
      responses:
        '200':
          description: Subscriber avatar deleted successfully.
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '404':
          description: Subscriber avatar not found.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
  /submfa:
    get:
      tags:
      - Subscriber MFA
      summary: Get the authenticated subscriber MFA configuration.
      description: Returns the reduced MFA configuration view for the authenticated subscriber.
      operationId: getSubscriberMfaConfig
      x-actor:
        type: authenticated-subscriber
        roles:
        - subscriber
        note: subscriber-only route; authentication is required
      x-validation:
        common:
        - authentication is required
        - the route is subscriber-only
      x-processing:
        sequence:
        - service: postgres
          type: db
          schema: ../../db/schema/subscribers.sql
          action: selectOne
          condition:
            id: token.userinfo.id == db.id
          output:
            subscriber: db.response
            subscriberFound: db.response exists
        - conditional:
          - when: subscriberFound == false
            sequence:
            - local:
                process: return not found
          - when: subscriberFound == true
            sequence:
            - local:
                process: build a `SubMfaConfig` response using subscriber.id; when subscriber MFA is enabled and method is
                  sms, set type to sms and set sms from the first stored mobile number without checking that the mobiles list
                  is non-empty; when subscriber MFA is enabled and method is email, set type to email and set email from subscriber.email;
                  when subscriber MFA is disabled, set type to disabled; otherwise leave type at the serializer default empty
                  string
      x-response-shaping:
        transformations:
        - return the serialized `SubMfaConfig` object
        - the response always uses the fixed serializer shape `id`, `type`, `sms`, and `email`
        - authenticator-based MFA is not represented by this handler response shape
      x-error-handling:
        local:
          '403':
          - authentication fails
          - the caller is not a subscriber
          '404':
          - the authenticated subscriber cannot be reloaded from `SubDB`
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The route is subscriber-only and requires authentication.
      responses:
        '200':
          description: Subscriber MFA configuration returned successfully.
          content:
