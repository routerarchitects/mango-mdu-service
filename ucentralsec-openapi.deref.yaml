    put:
      tags:
      - Preferences
      summary: Replace the authenticated admin-user preferences.
      description: Parses a Preferences object from the request body, overwrites its `id` with the authenticated admin-user
        ID, stamps `modified` with the current time, and replaces the stored preferences row.
      operationId: putPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: string
                  description: Parsed if present but overwritten with the authenticated user ID.
                modified:
                  type: integer
                  format: int64
                  description: Parsed if present but overwritten with the current time.
                data:
                  type: array
                  items:
                    type: object
                    properties:
                      tag:
                        type: string
                      value:
                        type: string
      x-actor: authenticated admin-user caller
      x-request-schema:
        note: The source accepts the full Preferences shape, but server logic overwrites `id` and `modified` before persistence.
      x-validation:
        common:
        - authentication is required
        - request body must parse as Preferences JSON
      x-processing:
        sequence:
        - local:
            process: parse the request body as Preferences and resolve the authenticated admin-user id
          variables:
            incomingPreferences: request.body
            preferencesId: token.userinfo.id
        - local:
            process: reject the request when the body does not parse as Preferences
        - local:
            process: overwrite incomingPreferences.id with the authenticated user id and overwrite incomingPreferences.modified
              with the current timestamp
        - service: postgres
          type: db
          schema: ../../db/schema/preferences.sql
          action: upsert
          condition:
            id: token.userinfo.id == db.id
          input:
            preferences: incomingPreferences
        - local:
            process: return the mutated in-memory Preferences object without checking the SetPreferences result
      x-response-shaping:
        transformations:
        - return the mutated Preferences object that carries the authenticated user id and fresh modified timestamp
        - missing existing rows are created rather than treated as update failures, matching `ReplaceRecord(...)` create-or-replace
          behavior
      x-error-handling:
        local:
          '400':
          - request body does not parse as Preferences JSON
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The current source does not branch on the SetPreferences return value before returning success.
      x-idempotency:
        enabled: false
        mode: none
        note: Repeated identical PUTs are not strictly idempotent because the server overwrites `modified` with the current
          timestamp on every call.
      responses:
        '200':
          description: Preferences stored successfully.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid Preferences JSON document.
          content:
            application/json:
              schema:
                type: object
  /signup:
    post:
      tags:
      - Subscriber Registration
      summary: Start or resend a subscriber signup verification flow.
      description: 'Starts a subscriber signup flow for the supplied email address.


        If the email address does not already belong to a pending subscriber signup, the service creates a pending subscriber
        record.

        If the email address already belongs to a subscriber that is still waiting for email verification, the service reuses
        that pending subscriber record.

        On successful completion, the service creates a signup verification action link that expires one hour later and returns
        the subscriber record used for the flow.

        '
      operationId: createSignup
      security: []
      parameters:
      - in: query
        name: email
        required: true
        description: Subscriber email address to sign up. The current source validates this with a lowercase-only email regex
          rather than a broad RFC-style email parser.
        schema:
          type: string
          format: email
      - in: query
        name: signupUUID
        required: true
        description: Signup UUID that will be embedded into the subscriber record as part of `signingUp` and later reused
          by the signup-completion flow.
        schema:
          type: string
      - in: query
        name: owner
        required: true
        description: Owner identifier copied into the subscriber record when the subscriber is created for the first time.
        schema:
          type: string
      - in: query
        name: operatorName
        required: true
        description: Operator name prefixed to `signupUUID` as `operatorName:signupUUID` in the stored `signingUp` field for
          first-time signup creation.
        schema:
