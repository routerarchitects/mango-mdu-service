            - local:
                process: if query.email_verification equals the exact string `true`, call `VerifySubEmail(existingUser)` and
                  continue regardless of its return value
            - local:
                process: if raw `userTypeProprietaryInfo` is present, run the MFA update branch exactly as coded for sms,
                  authenticator, email, or disable-all
            - service: postgres
              type: db
              schema: ../../db/schema/subscribers.sql
              action: update
              condition:
                id: targetId == db.id
              input:
                subscriber: existingUser after source-side mutations
              output:
                updated: db.result.success
            - conditional:
              - when: updated == false
                sequence:
                - local:
                    process: return record not updated
              - when: updated == true
