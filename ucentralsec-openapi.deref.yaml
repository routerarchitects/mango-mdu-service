                additionalProperties: false
                required:
                - nextIndex
                - moreCodes
                properties:
                  nextIndex:
                    type: integer
                    format: int64
                  moreCodes:
                    type: boolean
              examples:
                firstCodeAccepted:
                  value:
                    nextIndex: 2
                    moreCodes: true
                secondCodeAccepted:
                  value:
                    nextIndex: 2
                    moreCodes: false
        '400':
          description: Subscriber TOTP validation step was rejected.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '403':
