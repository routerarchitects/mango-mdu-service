                    description: Sanitized to an empty string before successful response serialization.
                  lastPasswords:
                    type: array
                    description: Sanitized to an empty array before successful response serialization.
                    items:
                      type: string
                  oauthType:
                    type: string
                    description: Sanitized to an empty string before successful response serialization.
                  oauthUserInfo:
                    type: string
                  modified:
                    type: integer
                    format: int64
                  signingUp:
                    type: string
        '400':
          description: Missing user identifier.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '403':
          description: Authentication failed or caller is outside the ROOT/ADMIN ownership scope.
          content:
