            - service: postgres
              type: db
              schema: ../../db/schema/actions.sql
              action: insert
              input:
                actionLink: generated `SUB_FORGOT_PASSWORD` action link
          - when: query.resetMFA does not parse as true and query.forgotPassword does not parse as true and query.resetPassword
