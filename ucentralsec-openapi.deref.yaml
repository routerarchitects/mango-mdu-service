          cache namespace in current source
        - if the raw body contains `userRole` and the new role differs from the existing role, non-root callers cannot assign
          `root`, and callers cannot change their own role
      x-processing:
        sequence:
        - local:
            process: read and validate the path `id`
          variables:
            targetId: path.id
        - conditional:
          - when: targetId is empty
            sequence:
            - local:
                process: return missing user id
        - service: postgres
          type: db
