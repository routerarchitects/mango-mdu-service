                          action: delete
                          condition:
                            id: targetId == db.id
                          output:
                            preferencesDeleted: db.result.success
                        - service: postgres
                          type: db
                          schema: ../../db/schema/tokens.sql
                          action: delete
                          condition:
                            username: targetId == db.username
                          output:
                            tokensDeleted: db.result.success
                        - service: postgres
                          type: db
                          schema: ../../db/schema/apikeys.sql
                          action: delete
                          condition:
                            useruuid: targetId == db.useruuid
                          output:
                            apiKeysDeleted: db.result.success
                        - local:
                            process: remove revoked bearer tokens from the in-memory auth cache as part of the source-side
                              RevokeAllTokens behavior
                        - local:
                            process: remove API-key tokens belonging to the deleted user from the in-memory auth cache system-wide
