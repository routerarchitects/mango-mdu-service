          '403':
          - shared authorization fails before handler execution
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: Validation state is kept in an in-process cache keyed by authenticated caller id. Success here only marks the
          cache session complete; the copied `subtotp` references do not themselves show the later subscriber-side persistence
          step that would consume the cached secret.
      responses:
        '200':
          description: Subscriber TOTP validation step accepted successfully.
