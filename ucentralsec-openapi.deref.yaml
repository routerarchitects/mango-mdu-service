        resetMfaBranch:
        - only exact lowercase `true` on `resetMFA` selects this branch
        - reset is allowed only when the caller is root, or the caller is admin and the target role is not root, or the caller
          is updating their own user id
        - the source reset branch clears `mfa.enabled`, clears `mfa.method`, clears mobiles, updates `modified`, appends one
          note, and does not clear `authenticatorSecret`
        - the source reset branch ignores the `UpdateUserInfo(...)` result and then reloads by the caller email, not by the
          target id
        passwordResetBranch:
        - if `resetMFA` is not selected, either exact lowercase `true` on `forgotPassword` or exact lowercase `true` on `resetPassword`
          selects this branch
        - this branch sets `Existing.changePassword = true` only in memory, creates one `SUB_FORGOT_PASSWORD` action link,
          and returns success without persisting the changed subscriber object
        normalUpdate:
        - when neither command branch is selected, the request body must parse as `SecurityObjects::UserInfo`
        - if the raw body contains `userRole`, the parsed role may not be `unknown` or `subscriber`
        - if the raw body contains `currentPassword`, it must pass `ValidateSubPassword(...)`
        - the source then calls `AuthService()->SetPassword(...)`, not `SetSubPassword(...)`
        - when normal-update MFA requests enable `sms`, SMS support must be enabled, at least one mobile number must be supplied,
          and the first number must pass `SMSSender()->IsNumberValid(..., caller.email)`
        - when normal-update MFA requests enable `email`, email MFA support must be enabled
        - when normal-update MFA requests enable `authenticator`, the method requires `MFAMETHODS::Validate(...)` to accept
