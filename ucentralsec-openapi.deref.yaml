  /email:
    post:
      tags:
      - Email
      summary: Send a plain-text email through the configured SMTP mailer.
      description: Sends an email using the configured SMTP mailer service. In the inspected source, the handler accepts a
        small JSON envelope but only uses the first element of `recipients`, always renders the hardcoded `password_reset.txt`
        template, and passes `subject`, `from`, and `text` as template attributes.
      operationId: sendEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subject
              - from
              - text
              - recipients
              properties:
                subject:
                  type: string
                from:
                  type: string
                text:
                  type: string
                recipients:
                  type: array
                  items:
                    type: string
            examples:
              passwordResetMail:
                value:
                  subject: Password reset
                  from: noreply@example.com
                  text: Reset your password using the supplied link.
                  recipients:
                  - user@example.com
      x-actor: authenticated caller invoking the generic OWSEC email helper
      x-idempotency:
        level: non-idempotent
        reason: Every successful request attempts to enqueue or send an email and can create duplicate outbound mail.
      x-validation:
        common:
        - authentication is required
        - the request body must be valid JSON
        - '`subject`, `from`, `text`, and `recipients` must all be present'
        - '`recipients` must be a JSON array'
        envelope:
        - the current handler reads only the first recipient from the `recipients` array
        - the current handler does not validate that the recipients array is non-empty before reading index 0
      x-processing:
        sequence:
        - local:
            process: parse the JSON body and ensure `subject`, `from`, `text`, and `recipients` are present and that `recipients`
              is an array
          variables:
            requestEnvelope: request.body
        - conditional:
          - when: requestEnvelope is missing any required field or recipients is not an array
            sequence:
            - local:
                process: return missing or invalid parameters
        - local:
            process: read the first recipient from the recipients array and build SMTP message attributes from `subject`,
              `from`, and `text`
          variables:
            recipient: request.body.recipients[0]
            subject: request.body.subject
            sender: request.body.from
            text: request.body.text
        - service: smtp-mailer
          type: local-service
          endpoint: SendMessage
          method: POST
          requestMapping:
            recipient: recipient
            template: password_reset.txt
            attributes:
              RECIPIENT_EMAIL: recipient
              SUBJECT: subject
              TEXT: text
              SENDER: sender
            html: false
          variables:
            sendSucceeded: service.result.success
        - conditional:
          - when: sendSucceeded == true
            sequence:
            - local:
                process: return HTTP 200 with no response body
          - when: sendSucceeded == false
            sequence:
            - local:
                process: return HTTP 503 service unavailable
      x-response-shaping:
        transformations:
        - successful execution returns HTTP 200 with no JSON response body
      x-error-handling:
        local:
          '400':
          - the request body is missing required fields
          - the `recipients` field is not an array
          '503':
          - the SMTP mailer reports send failure
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The handler delegates delivery to the configured SMTP mailer service and does not implement retry or per-recipient
          iteration itself.
      responses:
        '200':
          description: Email send request accepted by the current SMTP mailer path.
        '400':
          description: Missing or invalid email parameters.
          content:
            application/json:
              schema:
                type: object
        '503':
          description: SMTP mailer reported send failure.
  /oauth2:
    get:
      tags:
      - OAuth2
      summary: Return the authenticated caller profile.
      description: Returns the authenticated admin-user profile when `me=true`. Any other GET request is rejected as an unrecognized
        request.
      operationId: getOauth2Profile
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - in: query
        name: me
        required: false
        description: When true, return the authenticated caller profile.
        schema:
          type: boolean
          default: false
      x-actor: authenticated admin-user caller
      x-validation:
        common:
        - a valid authenticated admin-user token is required
        me:
        - the current source only accepts `me=true`; any other GET usage is rejected as an unrecognized request
      x-processing:
        sequence:
        - local:
            process: perform explicit token authorization for the request and resolve the authenticated caller user record
          variables:
            authenticatedUser: token.userinfo
            tokenExpired: local.result.expired
            securityContacted: local.result.contacted
        - conditional:
          - when: authorization failed because the token is expired
            sequence:
            - local:
                process: return unauthorized with the expired-token error
          - when: authorization failed for any other reason
            sequence:
            - local:
                process: return unauthorized with the invalid-token error
          - when: query.me == true
            sequence:
            - local:
                process: sanitize the authenticated user by clearing currentPassword, lastPasswords, and oauthType before
                  serialization, then return the sanitized user object
          - when: query.me != true
            sequence:
            - local:
                process: reject the request as unrecognized
      x-response-shaping:
        transformations:
        - return the sanitized authenticated user object directly
      x-error-handling:
        local:
          '400':
          - query.me is absent or false and no supported GET flow is selected
          '403':
          - token authorization fails
          - token is expired
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      responses:
        '200':
          description: Authenticated caller profile returned successfully.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Unsupported GET request.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Token invalid or expired.
          content:
            application/json:
              schema:
                type: object
    post:
      tags:
      - OAuth2
      summary: Execute an admin-user authentication or account-recovery flow.
      description: 'Executes one of several admin-user flows on the shared `/oauth2` endpoint:

        - refresh an existing token

        - return password/access policy requirements

        - request a forgot-password action link

        - resend an MFA code

        - complete an MFA challenge

        - perform username/password login, optionally with password change

        '
      operationId: postOauth2
      security: []
      parameters:
      - in: query
        name: grant_type
        required: false
        description: Use `refresh_token` to invoke the refresh-token flow.
        schema:
          type: string
          enum:
          - refresh_token
      - in: query
        name: requirements
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: forgotPassword
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: resendMfaCode
        required: false
        schema:
          type: boolean
          default: false
      - in: query
        name: completeMfaChallenge
        required: false
        schema:
          type: boolean
          default: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                userId:
                  type: string
                password:
                  type: string
                newPassword:
                  type: string
                refreshToken:
                  type: string
                uuid:
                  type: string
                  format: uuid
                answer:
                  type: string
      x-actor: anonymous login or recovery caller, or authenticated caller refreshing or completing MFA
      x-request-schema:
        note: The handler multiplexes several flows on one JSON body. Each flow reads only the fields it needs and ignores
          the others.
      x-validation:
        common:
        - the request body must parse as a JSON object
        - userId is lowercased before login or forgot-password processing
        refreshToken:
        - refresh-token flow requires query grant_type=refresh_token
        - refresh-token flow requires body.refreshToken
        - refresh-token flow also requires a bearer Authorization token whose stored refresh token matches body.refreshToken
        forgotPassword:
        - forgot-password flow is selected only when query forgotPassword=true and refresh-token flow did not already match
        resendMfaCode:
        - resend-MFA flow requires body.uuid
        completeMfaChallenge:
        - complete-MFA flow requires body.uuid and body.answer
        login:
        - default login flow validates the supplied username and password against the admin-user table
        - when a password change is required or requested, newPassword must satisfy the password policy and must not reuse
          a recent password
      x-processing:
        sequence:
        - local:
            process: parse the JSON body, lower-case body.userId, read optional password, newPassword, refreshToken, and UUID
              fields, and resolve query flags
          variables:
            userId: lower(request.body.userId)
            password: request.body.password
            newPassword: request.body.newPassword
            refreshToken: request.body.refreshToken
            challengeUuid: request.body.uuid
            grantType: query.grant_type
            requirements: query.requirements
            forgotPassword: query.forgotPassword
            resendMfaCode: query.resendMfaCode
            completeMfaChallenge: query.completeMfaChallenge
        - conditional:
          - when: refreshToken is present and grantType == refresh_token
            sequence:
            - local:
                process: validate the presented refresh token together with the current request context, rotate the token
                  set when valid, and capture the refreshed web token response
              variables:
                refreshSucceeded: local.result.success
                refreshedToken: local.result.webtoken
            - conditional:
              - when: refreshSucceeded == true
                sequence:
                - local:
                    process: return the refreshed web token object
              - when: refreshSucceeded == false
                sequence:
                - local:
                    process: return unauthorized with cannot-refresh-token
          - when: requirements == true
            sequence:
            - local:
                process: return the password validation expression, access policy, and password policy from AuthService
          - when: forgotPassword == true
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/users.sql
              action: selectOne
              condition:
                email: userId == db.email
              output:
                existingUser: db.response
                userExists: db.response exists
            - conditional:
              - when: userExists == true
                sequence:
                - local:
                    process: create an action-link record with action FORGOT_PASSWORD, a generated UUID, userAction true,
                      created now, and expires at now plus 24 hours
                  variables:
                    actionLink: local.result.actionLink
                - service: postgres
                  type: db
                  schema: ../../db/schema/actions.sql
                  action: insert
                  input:
                    actionLink: actionLink
            - local:
                process: return a token-shaped JSON object with userMustChangePassword true regardless of whether the email
                  exists
          - when: resendMfaCode == true
            sequence:
            - local:
                process: resend the MFA challenge code for the supplied challenge UUID
              variables:
                resendSucceeded: local.result.success
            - conditional:
              - when: resendSucceeded == true
                sequence:
                - local:
                    process: return the shared OK response object
              - when: resendSucceeded == false
                sequence:
                - local:
                    process: return unauthorized with bad-mfa-transaction
          - when: completeMfaChallenge == true
            sequence:
            - local:
                process: validate the submitted MFA challenge payload and, on success, produce the completed authenticated
                  user and token context
              variables:
                challengeCompleted: local.result.success
                challengeUserInfo: local.result.userInfoAndPolicy
            - conditional:
              - when: challengeCompleted == true
                sequence:
                - local:
                    process: return the completed challenge web token object
              - when: challengeCompleted == false
                sequence:
                - local:
                    process: return unauthorized with mfa-failure
          - when: no earlier branch matched
            sequence:
            - local:
                process: authenticate the supplied user credentials, optionally apply password-change handling, and capture
                  both the authorization result code and the authenticated user-and-token context
              variables:
                authorizationCode: local.result.code
                authorizedUser: local.result.userInfoAndPolicy
            - conditional:
              - when: authorizationCode == SUCCESS and authorizedUser.userinfo.userTypeProprietaryInfo.mfa.enabled == true
                  and MFA method is currently enabled
                sequence:
                - local:
                    process: start an MFA challenge for the authenticated user and capture the challenge payload returned
                      to the client
                  variables:
                    challengeStarted: local.result.success
                    challengePayload: local.result.payload
                - conditional:
                  - when: challengeStarted == true
                    sequence:
                    - local:
                        process: return the MFA challenge start payload containing uuid, created, question, and method
                  - when: challengeStarted == false
                    sequence:
                    - local:
                        process: log the broken-MFA condition and fall back to returning the issued web token
              - when: authorizationCode == SUCCESS and MFA challenge start is not used
                sequence:
                - local:
                    process: return the issued web token
              - when: authorizationCode == INVALID_CREDENTIALS
                sequence:
                - local:
                    process: return unauthorized with invalid-credentials
              - when: authorizationCode == PASSWORD_INVALID
                sequence:
                - local:
                    process: return unauthorized with password-invalid
              - when: authorizationCode == PASSWORD_ALREADY_USED
                sequence:
                - local:
                    process: return unauthorized with password-already-used
              - when: authorizationCode == USERNAME_PENDING_VERIFICATION
                sequence:
                - local:
                    process: return unauthorized with username-pending-verification
              - when: authorizationCode == PASSWORD_CHANGE_REQUIRED
                sequence:
                - local:
                    process: return unauthorized with password-change-required
              - when: authorizationCode == ACCOUNT_SUSPENDED
                sequence:
                - local:
                    process: return unauthorized with account-suspended
              - when: authorizationCode is any other value
                sequence:
                - local:
                    process: return unauthorized with invalid-credentials
      x-response-shaping:
        transformations:
        - return a web-token object for successful refresh and non-MFA login flows
        - return a token-shaped object with userMustChangePassword true for forgot-password requests whether or not the email
          exists
        - return an MFA challenge object with uuid, created, question, and method when MFA challenge start succeeds
        - return the shared OK response object for successful resend-MFA requests
        - return the password/access-policy requirements object for requirements=true
      x-error-handling:
        local:
          '400':
          - request body is absent or not valid JSON
          '403':
          - refresh token cannot be refreshed
          - resend-MFA request has no usable uuid or resend fails
          - complete-MFA request fails
          - credentials are invalid
          - new password is invalid
          - new password reuses a recent password
          - username is pending verification
          - password change is required
          - account is suspended
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: Forgot-password success does not depend on email existence or later mail delivery. MFA challenge start falls
          back to direct token return when StartMFAChallenge fails after login succeeds.
      x-idempotency:
        enabled: false
        mode: none
        note: The shared POST endpoint is not idempotent overall. Refresh rotates tokens, login issues fresh tokens, forgot-password
          creates a new action link when the user exists, and resend-MFA can trigger repeated side effects.
      responses:
        '200':
          description: One of the supported OAuth2 flow responses returned successfully.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid JSON request body.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Authentication, MFA, or password policy failure.
          content:
            application/json:
              schema:
                type: object
  /oauth2/{token}:
    delete:
      tags:
      - OAuth2
      summary: Log out the current token.
      description: Logs out the currently authenticated admin-user session when the bearer token exactly matches the `{token}`
        path parameter. The current source deletes the token locally and records logout; it does not call `RemoveTokenSystemWide`.
      operationId: deleteOauth2Token
      security:
      - bearerAuth: []
      parameters:
      - in: path
        name: token
        required: true
        description: Access token to revoke. It must exactly match the bearer Authorization token.
        schema:
          type: string
      x-actor: authenticated admin-user caller logging out the current bearer token
      x-validation:
        common:
        - the Authorization header must contain a bearer token
        - the path token must be present
        - the path token must exactly match the bearer token
      x-processing:
        sequence:
        - local:
            process: extract the bearer token from the Authorization header and compare it with the path token
          variables:
            pathToken: path.token
            bearerToken: request.authorization.bearer
        - conditional:
          - when: bearer token extraction fails
            sequence:
            - local:
                process: reject the request as missing or invalid parameters
          - when: pathToken is empty or pathToken != bearerToken
            sequence:
            - local:
                process: reject the request as missing or invalid parameters
          - when: pathToken == bearerToken
            sequence:
            - local:
                process: revoke the currently authenticated token and record the logout locally
            - local:
                process: return HTTP 204 and close the connection
      x-response-shaping:
        transformations:
        - return an empty 204 response body on successful logout
      x-error-handling:
        local:
          '400':
          - Authorization header is missing or not a bearer token
          - path token is missing
          - path token does not match the bearer token
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      x-idempotency:
        enabled: true
        mode: by-token
        keyFields:
        - path.token
        onRepeat:
          stateChange: none after the token is already removed locally
        note: The handler issues local logout work for the supplied token only when the path token matches the bearer token.
          Later repeats against an already-removed token converge on the same local state.
      responses:
        '204':
          description: Token logged out successfully.
        '400':
          description: Path token and bearer token did not form a valid logout request.
          content:
            application/json:
              schema:
                type: object
  /preferences:
