                      primary: true
                    mfa:
                      enabled: true
                      method: sms
                    authenticatorSecret: ''
      x-actor:
        type: authenticated-caller
        roles: []
        note: The constructor uses the shared automatic authorization path with no route-specific role restriction. The method
          then enforces ACL modify rules unless the handler is running in internal mode.
      x-idempotency:
        enabled: false
        mode: command-or-update
        note: The route mixes stateful command branches with mutable profile updates. `resetMFA` appends a note with the current
          timestamp, and the password-reset-link branch creates a fresh action link on each successful call.
      x-validation:
        common:
        - authentication is required by the shared handler path before `DoPut()` executes
        - path `id` must be present and non-empty
        - the target subscriber must exist in `SubDB`
        - when the handler is not internal, modify permission is checked through `ACLProcessor::Can(caller, existingUser,
