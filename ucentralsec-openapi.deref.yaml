    delete:
      tags:
      - API Keys
      summary: Delete one API key.
      description: Deletes the API key identified by `keyUuid` when it belongs to the path user UUID. Before deletion, OWSEC
        emits a system-wide remove-token event for the API key value through `AuthService::RemoveTokenSystemWide`.
      operationId: deleteApiKey
      parameters:
      - in: path
        name: uuid
        required: true
        description: User UUID that must own the API key being deleted.
        schema:
          type: string
          format: uuid
      - in: query
        name: keyUuid
        required: true
        description: API-key record UUID to delete.
        schema:
          type: string
          format: uuid
      x-actor:
        type: authenticated-user
        roles:
        - user
        - root
        note: authenticated user deleting their own API key, or authenticated root user deleting an API key for another user
      x-validation:
        common:
        - path uuid must be present
        - caller must be root or must match the path uuid
        - query keyUuid must be present
        - when the caller targets another user, the target user must exist
        - the resolved API-key record must belong to the path uuid
      x-processing:
        sequence:
        - local:
            process: read the target user UUID from the path and the API-key record UUID from the query string
          variables:
            targetUserUuid: path.uuid
            apiKeyRecordUuid: query.keyUuid
            callerUserUuid: token.userinfo.id
            callerRole: token.userinfo.userRole
        - local:
            process: reject the request when targetUserUuid is empty, apiKeyRecordUuid is empty, or the caller is neither
              root nor the same user
        - service: postgres
          type: db
          schema: ../../db/schema/users.sql
          action: exists
          when: targetUserUuid != callerUserUuid
          condition:
            id: path.uuid == db.id
          output:
            targetUserExists: db.response
        - conditional:
          - when: targetUserUuid != callerUserUuid and targetUserExists == false
            sequence:
            - local:
                process: return not found because the target user does not exist
          - when: targetUserUuid == callerUserUuid or targetUserExists == true
            sequence: []
        - service: postgres
          type: db
          schema: ../../db/schema/apikeys.sql
          action: selectOne
          condition:
            id: query.keyUuid == db.id
          output:
            existingApiKey: db.response
            existingApiKeyFound: db.response exists
        - conditional:
          - when: existingApiKeyFound == false
            sequence:
            - local:
                process: return not found
          - when: existingApiKey.userUuid != targetUserUuid
            sequence:
            - local:
                process: reject the request because the requested API key belongs to a different user
          - when: existingApiKey.userUuid == targetUserUuid
            sequence:
            - local:
                process: invoke AuthService.RemoveTokenSystemWide with existingApiKey.apiKey to enqueue system-wide token
                  removal before DB deletion
            - service: postgres
              type: db
              schema: ../../db/schema/apikeys.sql
              action: delete
              condition:
                id: query.keyUuid == db.id
            - local:
                process: return the shared DELETE success response without checking the DeleteApiKey result value
      x-response-shaping:
        transformations:
        - return the shared empty DELETE success response body used by RESTAPIHandler::OK on successful deletion
      x-error-handling:
        local:
          '400':
          - path uuid is missing or invalid
          - query keyUuid is missing or invalid
          - the resolved API key belongs to a different user than the path uuid
          '403':
          - caller is neither root nor the same user identified by the path uuid
          '404':
          - target user does not exist when deleting for another user
          - API-key record identified by keyUuid does not exist
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The remove-token helper is invoked before the DB delete. The helper only enqueues Kafka publication work locally,
          and the handler returns DELETE success after issuing the delete call without checking a delete-result boolean. The
          response does not wait for downstream consumers to process the remove-token event.
      x-idempotency:
        enabled: true
        mode: delete
        keyFields:
        - path.uuid
        - query.keyUuid
        onRepeat:
          stateChange: none after the first successful deletion
          returnsNotFound: true
        note: A repeated DELETE against the same already-deleted key converges on the same backend state but returns not found
          in the current source.
      responses:
        '200':
          description: API key deleted successfully.
        '400':
          description: API key deletion request rejected.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Target user or API key not found.
          content:
            application/json:
              schema:
                type: object
  /avatar/{id}:
    get:
      tags:
      - Avatars
      summary: Download one user avatar.
      description: 'Returns the stored avatar blob for the requested user ID.


        In the inspected OWSEC source, this GET path only checks that the caller is authenticated. It does not enforce owner-or-root
        authorization for the requested `{id}`. The storage-layer admin/email argument supplied by the handler is not used
        by `AvatarDB::GetAvatar`, so any authenticated caller can request any avatar record by ID when the record exists.


        The response Content-Type is inferred at runtime from the stored avatar filename through `Utils::FindMediaType(Name)`;
        the stored avatarType field is passed through the handler but ignored by the file-content sender.

        '
      operationId: getAvatar
      parameters:
      - in: path
        name: id
        required: true
        description: User UUID whose avatar should be downloaded.
        schema:
          type: string
          format: uuid
      x-actor:
        type: authenticated-user
        roles:
        - user
        - root
        note: any authenticated caller; current source does not enforce owner-or-root authorization for GET
      x-validation:
        common:
        - path id must be present
        - authentication is required
        access:
        - the current GET implementation does not perform owner-or-root authorization beyond authentication
      x-processing:
        sequence:
        - local:
            process: read the target avatar ID from the path
          variables:
            targetAvatarId: path.id
        - local:
            process: reject the request when targetAvatarId is empty
        - service: postgres
          type: db
          schema: ../../db/schema/avatars2.sql
          action: selectOne
          condition:
            id: path.id == db.id
          output:
            avatarContent: db.response.avatar
            avatarType: db.response.type
            avatarName: db.response.name
            avatarFound: db.response exists
        - local:
            process: when an avatar record is found, return the raw avatar content as a downloadable file, deriving the response
              media type from avatarName rather than the stored avatarType field
      x-response-shaping:
        transformations:
        - return the raw avatar bytes as the response body
        - expose Content-Disposition with attachment filename equal to the stored avatar name
        - derive the HTTP Content-Type from the stored avatar name using media-type inference, not from the stored avatarType
          field
      x-error-handling:
        local:
          '404':
          - path id is missing
          - no avatar record exists for the requested id
          '403':
          - authentication fails before handler execution
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      responses:
        '200':
          description: Avatar downloaded successfully. The concrete media type is inferred from the stored filename; common
            image media types are listed and application/octet-stream remains the fallback binary shape.
          headers:
            Content-Disposition:
              description: Attachment filename equal to the stored avatar name.
              schema:
                type: string
          content:
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/gif:
              schema:
                type: string
                format: binary
            application/octet-stream:
              schema:
                type: string
                format: binary
        '403':
          description: Authentication failed.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Avatar not found.
          content:
            application/json:
              schema:
                type: object
    post:
      tags:
      - Avatars
      summary: Upload or replace the authenticated user's avatar.
      description: 'Uploads one avatar blob for the authenticated user.


        The current OWSEC implementation ignores the path `{id}` during POST and always stores the avatar under the authenticated
        caller''s own user ID. It also persists the multipart part `name` parameter as the avatar name, not the uploaded filename
        parameter.


        Multipart request note: the source does not require a fixed multipart field name. Upload acceptance depends on the
        first consumed part having a non-empty Content-Disposition `name` parameter and total byte length smaller than the
        configured max size.

        '
      operationId: uploadAvatar
      parameters:
      - in: path
        name: id
        required: true
        description: Path segment required by routing. The current source ignores this value during POST and stores the avatar
          under the authenticated caller's user ID instead.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
              description: The handler reads the multipart body through Poco::Net::HTMLForm and consumes the uploaded bytes
                from the part handler stream.
      x-actor:
        type: authenticated-user
        roles:
        - user
        - root
        note: authenticated caller uploading their own avatar; path id is ignored for storage
      x-validation:
        common:
        - authentication is required
        - uploaded multipart part name must be non-empty
        - uploaded avatar length must be smaller than `openwifi.avatar.maxsize`, which defaults to 2000000 bytes
        sourceSpecific:
        - POST ignores path id and always uses the authenticated caller's own user id for storage
      x-processing:
        sequence:
        - local:
            process: resolve the authenticated caller user id and parse the multipart body through AvatarPartHandler, capturing
              part content type, part name, and raw bytes
          variables:
            storedAvatarId: token.userinfo.id
            multipartPartName: local.result.partName
            multipartContentType: local.result.contentType
            avatarBytes: local.result.avatarBytes
            avatarLength: local.result.avatarLength
        - conditional:
          - when: multipartPartName is empty or avatarLength is greater than or equal to configured avatar max size
            sequence:
            - local:
                process: return a JSON object containing avatarId equal to the authenticated caller id, errorCode 13, and
                  errorText "Avatar upload could not complete."
          - when: multipartPartName is not empty and avatarLength is smaller than configured avatar max size
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/avatars2.sql
              action: upsert
              condition:
                id: token.userinfo.id == db.id
              input:
                id: storedAvatarId
                type: multipartContentType
                created: current time
                name: multipartPartName
                avatar: avatarBytes
            - service: postgres
              type: db
              schema: ../../db/schema/users.sql
              action: update
              condition:
                id: token.userinfo.id == db.id
              input:
                avatar: current unix timestamp string
            - local:
                process: return a JSON object containing avatarId equal to the authenticated caller id and errorCode 0 without
                  checking whether SetAvatar or SetUserAvatarFlag reported success
      x-response-shaping:
        transformations:
        - return a JSON status object rather than the avatar metadata itself
        - on success, return `avatarId` and `errorCode: 0`
        - on upload rejection, return `avatarId`, `errorCode: 13`, and `errorText` with HTTP 200
      x-error-handling:
        local:
          '403':
          - authentication fails before handler execution
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The success response is driven only by multipart-name presence and size validation. The current source does
          not branch on SetAvatar or SetUserAvatarFlag return values before returning errorCode 0.
      x-idempotency:
        enabled: false
        mode: update
        note: Repeated successful uploads overwrite the stored avatar content and update the created timestamp in the avatar
          record. The operation is not idempotent with respect to stored blob bytes or upload time.
      responses:
        '200':
          description: Avatar upload result returned successfully. Upload rejections such as empty multipart part name or
            avatar size over the configured limit are represented as errorCode 13 in this JSON body, still with HTTP 200.
          content:
            application/json:
              schema:
                type: object
                description: Result body returned by avatar upload handlers, including successful uploads and upload rejections
                  represented as HTTP 200 payloads.
                additionalProperties: false
                required:
                - avatarId
                - errorCode
                properties:
                  avatarId:
                    type: string
                    format: uuid
                    description: Avatar identifier generated or returned by the upload handler.
                  errorCode:
                    type: integer
                    description: Source-defined upload result code; zero indicates success.
                  errorText:
                    type: string
                    description: Optional source-defined error text for rejected uploads.
              examples:
                success:
                  value:
                    avatarId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                    errorCode: 0
                rejected:
                  value:
                    avatarId: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                    errorCode: 13
                    errorText: Avatar upload could not complete.
        '403':
          description: Authentication failed.
          content:
            application/json:
              schema:
                type: object
    delete:
      tags:
      - Avatars
      summary: Delete one user avatar.
      description: Deletes the stored avatar for the requested user ID. Only root or the same user can delete the avatar in
        the current source.
      operationId: deleteAvatar
      parameters:
      - in: path
        name: id
