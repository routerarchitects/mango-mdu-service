  /subusers:
    get:
      tags:
      - Subscriber Users
      summary: List subscriber users, return selected subscriber users, or return a count.
      description: 'Returns subscriber-side user data from the subscriber database using one of three source-defined branches:


        1. `countOnly=true`: return a count object.

        2. `select` contains one or more comma-separated ids: return only the subscriber records that can be reloaded by those
        ids.

        3. Otherwise: return a paged subscriber list from `SubDB`, optionally filtered by a valid `operatorId`; `nameSearch`
        and `emailSearch` are only applied when that valid operator filter is present, with an optional `idOnly` projection.


        The current source contains one notable quirk: when `countOnly=true` and `operatorId` is missing or not a valid UUID,
        it returns `UserDB().Count()` instead of `SubDB().Count()`. In that missing or invalid `operatorId` case, any parsed
        `nameSearch` or `emailSearch` predicate is discarded rather than applied to the count or normal list query.

        '
      operationId: listSubscriberUsers
      parameters:
      - in: query
        name: offset
        required: false
        description: Numeric offset parsed by the shared query block. Missing values default to `0`; any parsed value less
          than `1` is normalized back to `0`.
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
      - in: query
        name: limit
        required: false
        description: Numeric limit parsed by the shared query block. Missing or invalid values default to `100`.
        schema:
          type: integer
          format: int64
          default: 100
          minimum: 0
      - in: query
        name: countOnly
        required: false
        description: Only exact lowercase `true` selects the count branch. Missing, invalid, or any other value behaves as
          false.
        schema:
          type: boolean
          default: false
      - in: query
        name: select
        required: false
        description: Comma-separated subscriber ids consumed by the shared query block. When at least one entry is present,
          this branch takes precedence over the normal paged list branch unless `countOnly=true`.
        schema:
          type: string
          example: id1,id2,id3
      - in: query
        name: idOnly
        required: false
        description: Only exact lowercase `true` changes the normal paged list branch to return subscriber ids instead of
          full user objects. This flag is ignored in the count and select branches.
        schema:
          type: boolean
          default: false
      - in: query
        name: operatorId
        required: false
        description: Optional owner filter. It only affects the count and normal paged list branches when the supplied value
          passes `Utils::ValidUUID(...)`.
        schema:
          type: string
      - in: query
        name: nameSearch
        required: false
        description: Optional case-insensitive substring filter on `name`, folded to lowercase and escaped through `ORM::Escape(...)`.
          The resulting predicate is only appended to the source where-clause when `operatorId` is present and passes `Utils::ValidUUID(...)`;
          otherwise it is discarded.
        schema:
          type: string
      - in: query
        name: emailSearch
        required: false
        description: Optional case-insensitive substring filter on `email`, folded to lowercase and escaped through `ORM::Escape(...)`.
          The resulting predicate is only appended to the source where-clause when `operatorId` is present and passes `Utils::ValidUUID(...)`;
          otherwise it is discarded.
        schema:
          type: string
      x-actor:
        type: authenticated-caller
        roles: []
        note: The constructor uses the shared automatic authorization path with no route-specific role restriction. The handler
          does not perform a post-auth ACL read check.
      x-validation:
        common:
        - authentication is required by the shared handler path before `DoGet()` executes
        - '`offset`, `limit`, `countOnly`, and `select` are parsed by the shared query block'
        - only exact lowercase `true` activates boolean query flags such as `countOnly` and `idOnly`
        filtering:
        - '`operatorId` affects filtering only when it is non-empty and passes `Utils::ValidUUID(...)`'
        - '`nameSearch` and `emailSearch` are lowercased and escaped through `ORM::Escape(...)`, but they are only embedded
          into the actual source where-clause when `operatorId` is present and valid; otherwise the parsed search predicate
          is discarded'
        branching:
        - when `countOnly=true`, the count branch runs even if `select` is also present
        - when `countOnly` is not true and `select` is non-empty, the select branch runs and `operatorId`, `nameSearch`, `emailSearch`,
          `offset`, `limit`, and `idOnly` are ignored
        - '`idOnly` only affects the normal paged list branch'
      x-processing:
        sequence:
        - local:
            process: parse shared query-block inputs and local query flags, then optionally build a lowercase escaped base
              search predicate from `nameSearch` and `emailSearch`
          variables:
            countOnly: query.countOnly parsed as boolean with default false
            selectedIds: query.select parsed into a comma-split array
            idOnly: query.idOnly parsed as boolean with default false
            operatorId: query.operatorId
            nameSearch: query.nameSearch
            emailSearch: query.emailSearch
            offset: query.offset parsed as uint64 with default 0 and normalized so values below 1 become 0
            limit: query.limit parsed as uint64 with default 100
            baseQuery: local.result.baseQuery
        - conditional:
          - when: countOnly == true
            sequence:
            - conditional:
              - when: operatorId is non-empty and `Utils::ValidUUID(operatorId)` is true
                sequence:
                - local:
                    process: build a where-clause using `owner='{operatorId}'` and append the optional baseQuery with `and`
                  variables:
                    whereClause: local.result.whereClause
                - service: postgres
                  type: db
                  schema: ../../db/schema/subscribers.sql
                  action: count
                  condition:
                    owner: query.operatorId == db.owner
                  input:
                    whereClause: whereClause
                  output:
                    count: db.response.count
              - when: operatorId is empty or not a valid UUID
                sequence:
                - service: postgres
                  type: db
                  schema: ../../db/schema/users.sql
                  action: count
                  output:
                    count: db.response.count
                - local:
                    process: return the source-defined fallback count from `UserDB().Count()` rather than `SubDB().Count()`;
                      discard any baseQuery built from `nameSearch` or `emailSearch`
            - local:
                process: return a JSON object containing exactly `count`
          - when: countOnly != true and selectedIds is empty
            sequence:
            - conditional:
              - when: operatorId is non-empty and `Utils::ValidUUID(operatorId)` is true
                sequence:
                - local:
                    process: build a where-clause using `owner='{operatorId}'` and append the optional baseQuery with `and`
                  variables:
                    whereClause: local.result.whereClause
              - when: operatorId is empty or not a valid UUID
                sequence:
                - local:
                    process: leave the where-clause empty even if operatorId was supplied; discard any baseQuery built from
                      `nameSearch` or `emailSearch`
                  variables:
                    whereClause: ''
            - service: postgres
              type: db
              schema: ../../db/schema/subscribers.sql
              action: selectMany
              input:
                offset: offset
                limit: limit
                whereClause: whereClause
              output:
                users: db.response.users
                loaded: db.result.success
            - conditional:
              - when: loaded == true
                sequence:
                - local:
                    process: sanitize each returned user by clearing `currentPassword`, `lastPasswords`, and `oauthType`
              - when: loaded == false
                sequence:
                - local:
                    process: continue with an empty in-memory `UserInfoList`
            - conditional:
              - when: idOnly == true
                sequence:
                - local:
                    process: return a JSON object containing `users` as an array of only the sanitized users' `id` values
              - when: idOnly != true
                sequence:
                - local:
                    process: serialize and return the full sanitized `UserInfoList::to_json` shape
          - when: countOnly != true and selectedIds is not empty
            sequence:
            - local:
                process: iterate `selectedIds` in order, perform one `SubDB().GetUserById(...)` lookup per selected id, silently
                  skip ids that are not found, sanitize each found user by clearing `currentPassword`, `lastPasswords`, and
                  `oauthType`, and append successful results in the original lookup order
            - local:
                process: serialize and return the full sanitized `UserInfoList::to_json` shape
      x-response-shaping:
        transformations:
        - the count branch returns a JSON object with exactly one field, `count`
        - the normal paged list branch returns either a full sanitized `UserInfoList` object or an object with `users` as
          an array of strings when `idOnly=true`
        - the select branch always returns the full sanitized `UserInfoList` object and ignores `idOnly`
        - sanitization clears `currentPassword`, clears `lastPasswords`, and clears `oauthType` before serializing user objects
        - missing ids in the select branch are silently omitted rather than producing an error
      x-error-handling:
        local:
          '403':
          - shared authorization fails before handler execution
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The handler does not convert `SubDB().GetUsers(...)` failure into an HTTP error; it returns an empty list instead.
          In the count branch, an invalid or missing `operatorId` triggers `UserDB().Count()` instead of `SubDB().Count()`
          in the copied source, and any `nameSearch` or `emailSearch` predicate is discarded when `operatorId` is missing
          or invalid.
      responses:
        '200':
          description: Subscriber user count, selected subscriber users, or paged subscriber list returned successfully.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - count
                  properties:
                    count:
                      type: integer
                      format: int64
                - type: object
                  additionalProperties: false
                  required:
                  - users
                  properties:
                    users:
                      type: array
                      items:
                        type: string
                - type: object
                  additionalProperties: false
                  required:
                  - users
                  properties:
                    users:
                      type: array
                      items:
                        type: object
                        additionalProperties: false
                        required:
                        - id
                        - name
                        - description
                        - avatar
                        - email
                        - validated
                        - validationEmail
                        - validationDate
                        - creationDate
                        - validationURI
                        - changePassword
                        - lastLogin
                        - currentLoginURI
                        - lastPasswordChange
                        - lastEmailCheck
                        - waitingForEmailCheck
                        - locale
                        - notes
                        - location
                        - owner
                        - suspended
                        - blackListed
                        - userRole
                        - userTypeProprietaryInfo
                        - securityPolicy
                        - securityPolicyChange
                        - currentPassword
                        - lastPasswords
                        - oauthType
                        - oauthUserInfo
                        - modified
                        - signingUp
                        properties:
                          id:
                            type: string
                          name:
                            type: string
                          description:
                            type: string
                          avatar:
                            type: string
                          email:
                            type: string
                          validated:
