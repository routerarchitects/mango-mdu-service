  /validateToken:
    get:
      tags:
      - Token Validation
      summary: Validate an OWSEC admin-user bearer token.
      description: Returns the serialized token and user context for the first valid admin-user token found among the raw
        `token` query parameters. In the inspected source, missing tokens, invalid tokens, revoked tokens, expired tokens,
        and tokens whose linked user can no longer be loaded all fall through to HTTP 404 only after the full parameter scan
        completes without a valid token.
      operationId: validateToken
      security: []
      parameters:
      - in: query
        name: token
        required: true
        description: Admin-user access token to validate.
        schema:
          type: string
      x-actor:
        type: anonymous-or-internal
        roles: []
        note: 'The handler declares `security: []` and validates admin-user bearer tokens supplied through raw query parameters
          rather than through the shared authenticated-caller path.'
      x-validation:
        common:
        - the handler scans all raw query parameters in order and only attempts validation for parameters whose name is exactly
          `token`
        - at least one supplied `token` parameter must exist in UserTokenDB, must not be revoked, and must still resolve to
          a loadable user record
        tokenState:
        - the current handler does not expose separate expired or revoked outcomes
        - the auth helper computes expiry, but this handler ignores the `Expired` output and returns not found when validation
          fails
      x-processing:
        sequence:
        - local:
            process: iterate all raw query string parameters in order; for each parameter named `token`, call `IsValidToken(...)`,
              return immediately on the first successful validation, and continue scanning after failed validations
          variables:
            rawQueryParameters: request URI query parameter list preserving duplicates and order
        - local:
            process: if any `token` parameter validates, serialize `UserInfoAndPolicy` by writing `tokenInfo` from the returned
              WebToken and `userInfo` from the returned UserInfo; otherwise, after the full loop completes without success,
              return not found without distinguishing missing, invalid, revoked, expired, or user-resolution failure
      x-response-shaping:
        transformations:
        - return a JSON object with top-level `tokenInfo` and `userInfo`
        - '`tokenInfo` is serialized from WebToken::to_json'
        - '`userInfo` is serialized from UserInfo::to_json'
      x-error-handling:
        local:
          '404':
          - no query parameter named `token` is present
          - one or more `token` parameters are present, but none validate successfully
          - one or more supplied tokens are revoked, expired, invalid, or point to an unloadable user, and no later `token`
            parameter validates successfully
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: This endpoint performs a synchronous local validation against persisted token and user records; it does not
          refresh token state or extend token lifetime.
