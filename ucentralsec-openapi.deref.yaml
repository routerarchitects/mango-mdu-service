        - the handler does not return the deleted user representation
      x-error-handling:
        local:
          '400':
          - path id is missing or empty
          '403':
          - shared authorization fails before handler execution
          - caller role is neither ROOT nor ADMIN and the handler returns ACCESS_DENIED
          - caller role is ADMIN and the target user is ROOT-managed, so the handler returns ACCESS_DENIED
          - caller role is ADMIN and the target user is self-owned, so the handler returns ACCESS_DENIED
          - caller role is ADMIN and the target user is owned by another caller, so the handler returns ACCESS_DENIED
          - ACLProcessor.CanAdminUserManage denies the delete request and the handler returns ACCESS_DENIED
          '404':
          - the target user does not exist
          - the delete operation reports failure after the target was loaded
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: After a successful UserDB.DeleteUser call, the handler performs best-effort cleanup of auth cache plus avatar,
          preferences, token, and API-key rows using schema-backed PostgreSQL deletes without checking those cleanup call
          results before returning success.
      responses:
