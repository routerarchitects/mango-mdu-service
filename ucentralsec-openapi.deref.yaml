  /systemEndpoints:
    get:
      tags:
      - System Endpoints
      summary: List discovered public system endpoints.
      description: 'Returns the current in-memory microservice registry as a `SystemEndpointList`.


        The handler calls `MicroServiceGetServices()`, maps each returned service to `SecurityObjects::SystemEndpoint`, and
        only assigns `type`, `id`, and `uri`. The response serializer then emits `vendor` and `authenticationType` from the
        model defaults, which are currently `OpenWiFi` and `internal_v1`.

        '
      operationId: getSystemEndpoints
      x-actor:
        type: authenticated-caller
        roles: []
        note: The constructor uses the shared automatic authorization path with no route-specific role restriction. The handler
          performs no additional ACL filtering after authorization.
      x-validation:
        common:
        - authentication is required by the shared handler path before `DoGet()` executes
        - there are no path parameters, query parameters, or request-body inputs for this operation
      x-processing:
        sequence:
        - local:
            process: call `MicroServiceGetServices()` to retrieve the current in-memory list of discovered services
          variables:
            services: local.result.services
        - local:
            process: create one `SecurityObjects::SystemEndpoint` per discovered service, copying only `type` from `service.Type`,
              `id` from `service.Id`, and `uri` from `service.PublicEndPoint`
          variables:
            endpoints: local.result.endpoints
        - local:
            process: serialize and return `SecurityObjects::SystemEndpointList`
      x-response-shaping:
        transformations:
        - return a JSON object containing `endpoints` as an array
        - each array entry is serialized from `SecurityObjects::SystemEndpoint`
        - because the handler does not overwrite them, `vendor` and `authenticationType` are emitted from the struct defaults
          `OpenWiFi` and `internal_v1`
      x-error-handling:
        local:
          '403':
          - shared authorization fails before handler execution
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The operation reads only in-memory discovered-service state and does not call downstream databases or remote
          APIs from this handler method.
      responses:
        '200':
          description: System endpoints returned successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - endpoints
                properties:
