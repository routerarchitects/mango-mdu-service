                - service: postgres
                  type: db
                  schema: ../../db/schema/subscribers.sql
                  action: selectOne
                  condition:
                    id: targetId == db.id
                  output:
                    responseUser: db.response
                - local:
                    process: sanitize the reloaded target user and return the full `UserInfo::to_json` shape
