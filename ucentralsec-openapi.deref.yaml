components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    ApiKeyAcl:
      type: object
      description: One API-key access-control entry describing the target service and the access level granted for that service.
      additionalProperties: false
      properties:
        service:
          type: string
          description: Service name or service identifier to which this ACL entry applies.
        access:
          type: string
          description: Access level granted for the service.
    ApiKeyRights:
      type: object
      description: Container for all access-control entries assigned to an API key.
      additionalProperties: false
      required:
      - acls
      properties:
        acls:
          type: array
          description: Ordered list of API-key ACL entries.
          items:
            type: object
            description: One API-key access-control entry describing the target service and the access level granted for that
              service.
            additionalProperties: false
            properties:
              service:
                type: string
                description: Service name or service identifier to which this ACL entry applies.
              access:
                type: string
                description: Access level granted for the service.
    ApiKeyEntry:
      type: object
      description: Stored API-key record returned by the API-key handlers.
      additionalProperties: false
      required:
      - id
      - userUuid
      - name
      - apiKey
      - salt
      - description
      - expiresOn
      - rights
      - lastUse
      properties:
        id:
          type: string
          format: uuid
          description: API-key record UUID.
        userUuid:
          type: string
          format: uuid
          description: UUID of the user who owns the API key.
        name:
          type: string
          description: Human-readable API-key name.
        apiKey:
          type: string
          description: API-key value or stored key material as emitted by the current handler.
        salt:
          type: string
          description: Salt associated with the stored API-key material.
        description:
          type: string
          description: Human-readable API-key description.
        expiresOn:
          type: integer
          format: int64
          description: Expiration timestamp for the API key.
        rights:
          allOf:
          - type: object
            description: Container for all access-control entries assigned to an API key.
            additionalProperties: false
            required:
            - acls
            properties:
              acls:
                type: array
                description: Ordered list of API-key ACL entries.
                items:
                  type: object
                  description: One API-key access-control entry describing the target service and the access level granted
                    for that service.
                  additionalProperties: false
                  properties:
                    service:
                      type: string
                      description: Service name or service identifier to which this ACL entry applies.
                    access:
                      type: string
                      description: Access level granted for the service.
          description: Access rights assigned to this API key.
        lastUse:
          type: integer
          format: int64
          description: Timestamp of the last recorded API-key use.
