        - forgotPassword preserves stored createdBy and ignores any client-supplied createdBy value
        normalUpdate:
        - raw owner is assignable only when the caller is root and the existing owner is empty
        - if raw currentPassword is present, it must pass ValidatePassword and AuthService.SetPassword
        - when normal-update MFA requests enable sms, SMS support must be enabled, at least one mobile number must be supplied,
          and the first number must pass SMSSender.IsNumberValid for caller.email
        - when normal-update MFA requests enable email, email MFA support must be enabled
        - when normal-update MFA requests enable authenticator, the method requires MFAMETHODS.Validate and then consumes
          TotpCache.CompleteValidation
        - when normal-update MFA receives userTypeProprietaryInfo with parsed mfa.enabled=false, the handler clears authenticatorSecret,
          clears mobiles, sets mfa.enabled=false, and leaves the existing mfa.method unchanged
        - ADMIN requests that set userRole to root are denied before remaining role-change authorization
        - for all other userRole changes, role-change authorization is delegated to ACLProcessor.CanChangeAdminUserRoleTo
      x-processing:
        sequence:
        - local:
            process: read and validate the path id, then derive caller identity, caller email, and lowercased role
          variables:
            targetId: path.id
            callerUser: token.userinfo
            callerId: token.userinfo.id
            callerEmail: token.userinfo.email
            callerRole: token.userinfo.userRole lowercased
        - conditional:
          - when: targetId is empty
            sequence:
            - local:
                process: return missing user id
          - when: callerRole is neither "root" nor "admin"
            sequence:
            - local:
                process: return 403 ACCESS_DENIED
        - service: postgres
          type: db
          schema: ../../db/schema/users.sql
          action: selectOne
          condition:
            id: targetId == db.id
          output:
            existingUser: db.response
            targetFound: db.response exists
        - conditional:
          - when: targetFound == false
            sequence:
            - local:
                process: return 404 target not found
          - when: targetFound == true
            sequence:
            - local:
                process: initialize explicit modify authorization decision
              variables:
                explicitModifyAllowed: false
            - conditional:
              - when: callerRole == "root"
                sequence:
                - local:
                    process: allow modify because ROOT can update any loaded admin-user
                  variables:
                    explicitModifyAllowed: true
              - when: callerRole == "admin" and existingUser.userRole == "root"
                sequence:
                - local:
                    process: return 403 ACCESS_DENIED because ADMIN cannot update ROOT target users
              - when: callerRole == "admin" and existingUser.id == callerId
                sequence:
                - local:
                    process: allow self-update where ACL permits it
                  variables:
                    explicitModifyAllowed: true
              - when: callerRole == "admin" and existingUser.createdBy is non-empty and existingUser.createdBy == callerId
                sequence:
                - local:
                    process: allow update because ADMIN owns the target through createdBy
                  variables:
                    explicitModifyAllowed: true
              - when: callerRole == "admin" and existingUser.createdBy is empty and existingUser.id != callerId
                sequence:
                - local:
                    process: return 403 ACCESS_DENIED because ADMIN cannot update ROOT-managed legacy rows
              - when: callerRole == "admin" and existingUser.createdBy != callerId and existingUser.id != callerId
                sequence:
                - local:
                    process: return 403 ACCESS_DENIED because ADMIN cannot update users created by another caller
            - conditional:
              - when: explicitModifyAllowed == true
                sequence:
                - local:
                    process: evaluate admin-user modify authorization through ACLProcessor.CanAdminUserManage as a secondary
                      guard
                  variables:
                    aclAllowed: ACLProcessor.CanAdminUserManage(callerUser, existingUser, MODIFY)
                - conditional:
                  - when: aclAllowed == false
                    sequence:
                    - local:
                        process: return 403 ACCESS_DENIED
                  - when: aclAllowed == true
                    sequence:
                    - conditional:
                      - when: query.resetMFA equals the exact string "true"
                        sequence:
                        - local:
                            process: clear existingUser.userTypeProprietaryInfo.mfa.enabled, clear existingUser.userTypeProprietaryInfo.mfa.method,
                              and clear mobiles
                        - local:
                            process: preserve stored existingUser.createdBy and db.createdby mapping, ignore any client-supplied
                              createdBy value, leave authenticatorSecret untouched, append one note created by the caller,
                              and set modified to now
                        - service: postgres
                          type: db
                          schema: ../../db/schema/users.sql
                          action: update
                          condition:
                            id: targetId == db.id
                          input:
                            user: existingUser
                          output:
                            mfaResetSaved: db.result.success
                        - service: postgres
                          type: db
                          schema: ../../db/schema/users.sql
                          action: selectOne
                          condition:
                            id: targetId == db.id
                          output:
                            responseUser: db.response
                        - local:
                            process: map db.createdby to response.createdBy, sanitize sensitive fields (currentPassword, lastPasswords,
