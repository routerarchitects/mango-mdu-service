  /users:
    get:
      tags:
      - Users
      summary: List admin-user records within the caller's allowed scope.
      description: 'Returns admin-user data from the user database using one of two branches:


        1. `select` contains one or more comma-separated ids: return only the authorized user records that can be reloaded
        by those ids.

        2. Otherwise: return a paged user list from `UserDB`, optionally filtered by `nameSearch` and `emailSearch` before
        pagination, with an optional `idOnly` projection.


        Authorization is role-scoped. ROOT callers can access all users. ADMIN callers can access only users whose `createdBy`
        matches the authenticated caller id. All other roles are denied with `403 ACCESS_DENIED`.

        Legacy admin-user rows with empty or null `createdBy` remain ROOT-managed and are omitted from ADMIN list results
        until ownership is backfilled.

        '
      operationId: getUsers
      parameters:
      - in: query
        name: offset
        required: false
        description: Numeric offset parsed by the shared query block. Missing values default to `0`; any parsed value less
          than `1` is normalized back to `0`.
        schema:
          type: integer
          format: int64
          default: 0
          minimum: 0
      - in: query
        name: limit
        required: false
        description: Numeric limit parsed by the shared query block. Missing or invalid values default to `100`.
        schema:
          type: integer
          format: int64
          default: 100
          minimum: 0
      - in: query
        name: select
        required: false
        description: Comma-separated user ids consumed by the shared query block. When at least one entry is present, this
          branch takes precedence over the normal paged list branch.
        schema:
          type: string
          example: id1,id2,id3
      - in: query
        name: nameSearch
        required: false
        description: Optional case-insensitive substring filter on `name`, folded to lowercase and applied by the DB query
          before pagination after `ORM::Escape(...)`.
        schema:
          type: string
      - in: query
        name: emailSearch
        required: false
        description: Optional case-insensitive substring filter on `email`, folded to lowercase and applied by the DB query
          before pagination after `ORM::Escape(...)`.
        schema:
          type: string
      - in: query
        name: idOnly
        required: false
        description: Exact string `true` changes the normal paged list branch to return user ids instead of full user objects;
          missing or any other value behaves as false. This flag is ignored in the select branch.
        schema:
          type: string
      x-actor:
        type: authenticated-caller
        roles:
        - root
        - admin
        note: ROOT can list all users. ADMIN can list only users created by the authenticated caller.
      x-validation:
        common:
        - authentication is required by the shared handler path before DoGet executes
        - caller role must be root or admin, case-insensitively; all other roles return 403 ACCESS_DENIED
        - offset, limit, and select are parsed by the shared query block
        - idOnly is compared as the exact string true; missing or any other value behaves as false
        scope:
        - this admin-user ACL flow applies only to RESTAPI_user_handler and RESTAPI_users_handler
        - RESTAPI_subuser_handler continues to use the existing generic ACLProcessor.Can behavior
        filtering:
        - nameSearch and emailSearch are lowercased and escaped through ORM.Escape before being applied by the DB query
        - normal ADMIN list uses `users.sql` with `action: selectMany` and a `createdby == callerId` filter to enforce the
            same ACL read policy
        - selected ID lookup evaluates ACLProcessor.CanAdminUserManage for each loaded user
        - legacy admin-user rows with empty or null createdBy are omitted for ADMIN by ACL and list scope
        authorization:
        - admin-user authorization is delegated to ACLProcessor.CanAdminUserManage
        - ROOT is allowed for admin-user management operations
        - ADMIN is scoped to createdBy-owned users
        branching:
        - when select is non-empty, the select branch runs and nameSearch, emailSearch, offset, limit, and idOnly are ignored
        - idOnly affects only the normal paged list branch
        - missing ids or unauthorized ids in the select branch are silently omitted rather than producing an error
      x-processing:
        sequence:
        - local:
            process: parse query input, derive caller identity and role, and normalize the optional nameSearch/emailSearch
              terms for DB filtering
          variables:
            callerUser: token.userinfo
            callerId: token.userinfo.id
            callerRole: token.userinfo.userRole lowercased
            idOnly: query.idOnly equals the exact string "true"
            selectedIds: query.select parsed into a comma-split array
            nameSearch: query.nameSearch
            emailSearch: query.emailSearch
            nameSearchNormalized: lowercased and escaped query.nameSearch when non-empty
            emailSearchNormalized: lowercased and escaped query.emailSearch when non-empty
            offset: query.offset parsed as uint64 with default 0 and normalized so values below 1 become 0
