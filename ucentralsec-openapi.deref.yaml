          rather than the target subscriber record
        - the password-reset-link branch returns the shared `OK()` JSON helper payload with `Code`, `Operation`, and `Details`
        - the normal update branch returns the sanitized reloaded target `UserInfo::to_json` serializer shape
        - sanitization clears `currentPassword`, clears `lastPasswords`, and clears `oauthType` before serializing user objects
      x-error-handling:
        local:
          '400':
          - path `id` is missing or empty
          - the normal-update request body does not parse as `UserInfo`
          - raw `userRole` is present but parses as `unknown` or `subscriber`
          - raw `currentPassword` fails subscriber password validation
          - '`AuthService()->SetPassword(...)` rejects the new password'
          - requested MFA method is invalid
          - SMS MFA is requested while SMS support is disabled
          - email MFA is requested while email MFA support is disabled
          - SMS MFA is requested without a mobile number
          - SMS MFA is requested with a first mobile number that is not valid for the caller email
          - authenticator MFA is requested but the required non-subscriber TOTP verification is incomplete
          - the final update operation reports record-not-updated
          '403':
