    delete:
      tags:
      - Users
      summary: Delete one admin-user record within the caller's allowed scope.
      description: 'Deletes one user from `UserDB`, then performs source-side cleanup of auth cache, avatar, preferences,
        user tokens, and API keys.


        Authorization is role-scoped after the target user is loaded. ROOT callers can delete any user. ADMIN callers can
        delete only users they created, cannot delete ROOT users, and cannot delete their own user record. All other roles
        are denied with `403 ACCESS_DENIED`.

        '
      operationId: deleteUser
      parameters:
      - in: path
        name: id
        required: true
        description: User UUID targeted for deletion.
        schema:
          type: string
      x-actor:
        type: authenticated-caller
        roles:
        - root
        - admin
        note: ROOT can delete any user. ADMIN can delete only non-root users created by the authenticated caller, excluding
          self-delete.
      x-idempotency:
        enabled: false
        mode: delete
        note: The first successful delete removes the user record and related artifacts. Repeating the same request normally
          changes the result to not found.
      x-validation:
        common:
        - authentication is required by the shared handler path before DoDelete executes
        - the target user must exist in UserDB
        - caller role must be root or admin, case-insensitively; all other roles return 403 ACCESS_DENIED
        scope:
        - this admin-user ACL flow applies only to RESTAPI_user_handler and RESTAPI_users_handler
        - RESTAPI_subuser_handler continues to use the existing generic ACLProcessor.Can behavior
        authorization:
        - admin-user authorization is delegated to ACLProcessor.CanAdminUserManage
        - ACL is evaluated after target resource loading for delete operations
        - ROOT is allowed for admin-user management operations
        - ADMIN is scoped to createdBy-owned users
        - ADMIN self-delete is denied
        - ADMIN cannot manage ROOT targets
        - legacy null or empty createdBy rows are treated as ROOT-managed by ACL
      x-processing:
        sequence:
        - local:
            process: read and validate the path id, then derive caller identity and lowercased role
          variables:
            targetId: path.id
            callerUser: token.userinfo
            callerId: token.userinfo.id
            callerRole: token.userinfo.userRole lowercased
        - conditional:
          - when: targetId is empty
            sequence:
            - local:
                process: return missing user id
          - when: callerRole is neither "root" nor "admin"
            sequence:
            - local:
                process: return 403 ACCESS_DENIED
        - service: postgres
          type: db
          schema: ../../db/schema/users.sql
          action: selectOne
          condition:
            id: targetId == db.id
          output:
            targetUser: db.response
            targetFound: db.response exists
        - conditional:
          - when: targetFound == false
            sequence:
            - local:
                process: return 404 target not found
          - when: targetFound == true
