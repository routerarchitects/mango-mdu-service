                      - vendor
                      - uri
                      - authenticationType
                      properties:
                        type:
                          type: string
                        id:
                          type: integer
                          format: int64
                        vendor:
                          type: string
                          description: Defaulted by the source model to `OpenWiFi` when the handler does not overwrite it.
                        uri:
                          type: string
