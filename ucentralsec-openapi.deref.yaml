                - service: postgres
                  type: db
                  schema: ../../db/schema/subscribers.sql
                  action: update
                  condition:
                    id: targetId == db.id
                  input:
                    subscriber: existingUser
                - service: postgres
                  type: db
                  schema: ../../db/schema/subscribers.sql
                  action: selectOne
                  condition:
                    email: caller.email == db.email
                  output:
                    responseUser: db.response
