                format: binary
        '400':
          description: TOTP session could not be started.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '403':
          description: Authentication failed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
    put:
      tags:
      - TOTP
      summary: Submit one TOTP verification code for the authenticated caller's non-subscriber enrollment session.
      description: 'Advances the non-subscriber in-memory TOTP validation session using query parameters only.


        A successful first code returns `nextIndex: 2` and `moreCodes: true`. A successful second code returns `nextIndex`
        unchanged from the supplied query value and `moreCodes: false`; this endpoint does not persist the secret by itself.

        '
      operationId: putTotpValidationCode
      parameters:
      - in: query
        name: value
        required: false
        description: TOTP code string passed directly to `TotpCache()->ContinueValidation(...)`. Missing values default to
          the empty string.
        schema:
          type: string
      - in: query
        name: index
        required: false
        description: Validation step index passed directly to `TotpCache()->ContinueValidation(...)`. Missing or non-numeric
          values default to `0`.
        schema:
          type: integer
          format: int64
          enum:
          - 1
          - 2
      x-actor:
        type: authenticated-caller
        roles: []
        note: The constructor uses the shared automatic authorization path with no route-specific role restriction. The TOTP
          cache entry lookup uses `Subscriber=false`.
      x-idempotency:
        enabled: false
        mode: command
        note: The handler advances mutable in-memory session state. A successful first code increments cache verification
          state and stores the submitted code; replaying the same request can therefore change the result and often becomes
          a repeated-code or invalid-protocol failure.
      x-validation:
        common:
        - authentication is required by the shared handler path before `DoPut()` executes
        - '`value` is read from the query string with default empty string'
        - '`index` is read from the query string with default numeric value `0`; non-numeric text also falls back to `0`'
        - the handler always passes `Subscriber=false` into `TotpCache()->ContinueValidation(...)`
        sessionRules:
        - a matching non-subscriber-scoped cache entry for the authenticated caller must exist
        - the cached validation session must be younger than 15 minutes
        - the first successful submission requires `index=1`, zero prior verifications, and a valid current TOTP code
        - the second successful submission requires `index=2`, exactly one prior verification, a valid current TOTP code,
          and a code value different from the first accepted code
        errorPrecedence:
        - when the session branch reaches source-side error disambiguation, invalid code is checked before invalid index
        - repeated code is reported only after the code validates successfully and the provided `index` is one of the checked
          values
      x-processing:
        sequence:
        - local:
            process: read the `value` and `index` query parameters and resolve the authenticated caller identity used by the
              shared authorization path
          variables:
            submittedCode: query.value default ""
            submittedIndex: query.index parsed as uint64 with default 0
            caller: token.userinfo
        - local:
            process: call `TotpCache()->ContinueValidation(caller, false, submittedCode, submittedIndex, moreCodes, error)`
              where `submittedIndex` is passed by reference and may be mutated on success
          variables:
            nextIndex: submittedIndex
            moreCodes: local.result.moreCodes
            validationSucceeded: local.result.success
            failure: local.result.error
        - conditional:
          - when: validationSucceeded == true
            sequence:
            - local:
                process: return a JSON object containing `nextIndex` from the possibly mutated index variable and `moreCodes`
                  from the cache result
          - when: validationSucceeded == false
            sequence:
            - local:
                process: return bad request using the exact TOTP cache error selected by source logic
      x-response-shaping:
        transformations:
        - return a JSON object with exactly `nextIndex` and `moreCodes`
        - the successful first-code branch increments `nextIndex` from `1` to `2`
        - the successful second-code branch leaves `nextIndex` equal to the supplied query value because source does not increment
          it in that branch
        - no TOTP secret, QR code, or persisted MFA state is returned by this endpoint
      x-error-handling:
        local:
          '400':
          - no non-subscriber-scoped validation session exists for the authenticated caller
          - the cached session exists but is older than 15 minutes
          - the submitted TOTP code is invalid for the current secret and time window
          - the submitted `index` is invalid after the code itself validates
          - the submitted code repeats the first accepted code when the cache expects a new second code
          - the request violates the expected two-step validation sequence and source returns invalid protocol
          '403':
          - shared authorization fails before handler execution
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: Validation state is kept in an in-process cache keyed by authenticated caller id. Success here only marks the
          cache session complete; later non-subscriber user-update flows must still call `TotpCache()->CompleteValidation(...,
          false, ...)` to retrieve and persist the secret.
      responses:
        '200':
          description: TOTP validation step accepted successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - nextIndex
                - moreCodes
                properties:
                  nextIndex:
                    type: integer
                    format: int64
                  moreCodes:
                    type: boolean
              examples:
                firstCodeAccepted:
                  value:
                    nextIndex: 2
                    moreCodes: true
                secondCodeAccepted:
                  value:
                    nextIndex: 2
                    moreCodes: false
        '400':
          description: TOTP validation step was rejected.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '403':
          description: Authentication failed.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
  /user/{id}:
    get:
      tags:
      - Users
      summary: Get one admin-user record by UUID or email within the caller's allowed scope.
      description: 'Returns one admin-user `UserInfo` record from `UserDB`.


        The handler lowercases the path `id` before lookup. When `byEmail=true` is passed exactly as that lowercase string,
        the lowercased path value is treated as an email address; missing or any other query value falls back to ID lookup.


        Authorization is role-scoped after the target user is loaded. ROOT callers can retrieve any user. ADMIN callers can
        retrieve only users whose `createdBy` matches the authenticated caller id. All other roles are denied with `403 ACCESS_DENIED`.

        '
      operationId: getUser
      parameters:
      - in: path
        name: id
        required: true
        description: User identifier. The handler lowercases this path value before either ID or email lookup.
        schema:
          type: string
      - in: query
        name: byEmail
        required: false
        description: Exact string `true` selects email lookup; missing or any other value falls back to ID lookup.
        schema:
          type: string
      x-actor:
        type: authenticated-caller
        roles:
        - root
        - admin
        note: ROOT can retrieve any user. ADMIN can retrieve only users created by the authenticated caller.
      x-validation:
        common:
        - authentication is required by the shared handler path before DoGet executes
        - the handler lowercases the path value before lookup
        - caller role must be root or admin, case-insensitively; all other roles return 403 ACCESS_DENIED
        scope:
        - this admin-user ACL flow applies only to RESTAPI_user_handler and RESTAPI_users_handler
        - RESTAPI_subuser_handler continues to use the existing generic ACLProcessor.Can behavior
        lookup:
        - when query byEmail equals the exact string true, the handler reads the target through UserDB.GetUserByEmail
        - missing or any other value reads the target through UserDB.GetUserById
        authorization:
        - if the target user is not found, return 404
        - admin-user authorization is delegated to ACLProcessor.CanAdminUserManage
        - ACL is evaluated after target resource loading for read operations
        - ROOT is allowed for admin-user management operations
        - ADMIN is scoped to createdBy-owned users
        - ADMIN cannot manage ROOT-managed legacy rows whose createdBy is null or empty
      x-processing:
        sequence:
        - local:
            process: read and validate the path id, lowercase it before choosing the lookup mode, and derive caller identity
              and lowercased role
          variables:
            targetIdOrEmail: path.id lowercased
            byEmailRaw: query.byEmail
            callerUser: token.userinfo
            callerId: token.userinfo.id
            callerRole: token.userinfo.userRole lowercased
        - conditional:
          - when: targetIdOrEmail is empty
            sequence:
            - local:
                process: return missing user id
          - when: callerRole is neither "root" nor "admin"
            sequence:
            - local:
                process: return 403 ACCESS_DENIED
          - when: byEmailRaw equals "true"
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/users.sql
              action: selectOne
              condition:
                email: targetIdOrEmail == db.email
              output:
                targetUser: db.response
                userFound: db.response exists
          - when: byEmailRaw is anything other than the exact string "true"
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/users.sql
              action: selectOne
              condition:
                id: targetIdOrEmail == db.id
              output:
                targetUser: db.response
                userFound: db.response exists
        - conditional:
          - when: userFound == false
            sequence:
            - local:
                process: return 404 target not found
          - when: userFound == true
            sequence:
            - conditional:
              - when: callerRole == "root"
                sequence:
                - local:
                    process: allow read because ROOT can retrieve any loaded admin-user
              - when: callerRole == "admin" and targetUser.createdBy is non-empty and targetUser.createdBy == callerId
                sequence:
                - local:
                    process: allow read because ADMIN owns the target through createdBy
              - when: callerRole == "admin" and (targetUser.createdBy is empty or targetUser.createdBy != callerId)
                sequence:
                - local:
                    process: return 403 ACCESS_DENIED because ADMIN cannot read non-owned or ROOT-managed legacy users
            - local:
                process: evaluate admin-user read authorization through ACLProcessor.CanAdminUserManage
              variables:
                aclAllowed: ACLProcessor.CanAdminUserManage(callerUser, targetUser, READ)
            - conditional:
              - when: aclAllowed == false
                sequence:
                - local:
                    process: return 403 ACCESS_DENIED
              - when: aclAllowed == true
                sequence:
                - local:
                    process: map db.createdby to response.createdBy, sanitize sensitive fields (currentPassword, lastPasswords,
                      oauthType), and serialize the full admin-user response
      x-response-shaping:
        transformations:
        - successful responses return the full sanitized admin-user response shape
        - sanitization clears currentPassword, lastPasswords, and oauthType before serialization
      x-error-handling:
        local:
          '400':
          - path id is missing or empty
          '403':
          - shared authorization fails before handler execution
          - caller role is neither ROOT nor ADMIN and the handler returns ACCESS_DENIED
          - caller role is ADMIN and the target user's createdBy is empty or null, so the handler returns ACCESS_DENIED
          - caller role is ADMIN and the target user's createdBy does not match callerId, so the handler returns ACCESS_DENIED
          - ACLProcessor.CanAdminUserManage denies the read request and the handler returns ACCESS_DENIED
          '404':
          - no user matches the selected ID lookup
          - no user matches the selected email lookup
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      responses:
        '200':
          description: Sanitized authorized user returned successfully.
          content:
            application/json:
              schema:
                description: Sanitized admin-user response shape for `/user/{id}` and `/users`, including ownership metadata.
                type: object
                additionalProperties: false
                required:
                - id
                - name
                - description
                - avatar
                - email
                - validated
                - validationEmail
                - validationDate
                - creationDate
                - validationURI
                - changePassword
                - lastLogin
                - currentLoginURI
                - lastPasswordChange
                - lastEmailCheck
                - waitingForEmailCheck
                - locale
                - notes
                - location
                - owner
                - createdBy
                - suspended
                - blackListed
                - userRole
                - userTypeProprietaryInfo
                - securityPolicy
                - securityPolicyChange
                - currentPassword
                - lastPasswords
                - oauthType
                - oauthUserInfo
                - modified
                - signingUp
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  avatar:
                    type: string
                  email:
                    type: string
                  validated:
                    type: boolean
                  validationEmail:
                    type: string
                  validationDate:
                    type: integer
                    format: int64
                  creationDate:
                    type: integer
                    format: int64
                  validationURI:
                    type: string
                  changePassword:
                    type: boolean
                  lastLogin:
                    type: integer
                    format: int64
                  currentLoginURI:
                    type: string
                  lastPasswordChange:
                    type: integer
                    format: int64
                  lastEmailCheck:
                    type: integer
                    format: int64
                  waitingForEmailCheck:
                    type: boolean
                  locale:
                    type: string
                  notes:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - created
                      - createdBy
                      - note
                      properties:
                        created:
                          type: integer
                          format: int64
                        createdBy:
                          type: string
                        note:
                          type: string
                  location:
                    type: string
                  owner:
                    type: string
                  createdBy:
                    type: string
                    nullable: true
                    description: UUID or string identifier of the user who created this admin-user record. May be null or
                      empty for legacy rows; such rows are treated as ROOT-managed until backfilled.
                  suspended:
                    type: boolean
                  blackListed:
                    type: boolean
                  userRole:
                    type: string
                    enum:
                    - root
                    - admin
                    - subscriber
                    - partner
                    - csr
                    - system
                    - installer
                    - noc
                    - accounting
                    - unknown
                  userTypeProprietaryInfo:
                    type: object
                    additionalProperties: false
                    required:
                    - mobiles
                    - mfa
                    - authenticatorSecret
                    properties:
                      mobiles:
                        type: array
                        items:
                          type: object
                          additionalProperties: false
                          required:
                          - number
                          - verified
                          - primary
                          properties:
                            number:
                              type: string
                            verified:
                              type: boolean
                            primary:
                              type: boolean
                      mfa:
                        type: object
                        additionalProperties: false
                        required:
                        - enabled
