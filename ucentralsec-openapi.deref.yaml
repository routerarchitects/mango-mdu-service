openapi: 3.0.1
info:
  title: OpenWiFi uCentralSec API
  description: Root OpenAPI document for OWSEC REST APIs, shared schemas, responses, and security definitions.
  version: 1.0.0
  license:
    name: Proprietary
servers:
- url: /
  description: Relative API base URL for the deployed OWSEC service.
security:
- bearerAuth: []
- ApiKeyAuth: []
paths:
  /actionLink:
    get:
      tags:
      - Action Links
      summary: Render an action-link HTML page.
      description: 'Resolves a persisted OWSEC action link by `id` and renders the HTML page associated with the requested
        `action`.


        The inspected OWSEC source currently supports these GET actions:

        - `password_reset`

        - `sub_password_reset`

        - `email_verification`

        - `sub_email_verification`

        - `signup_verification`


        Unsupported actions, missing links, and expired links are rendered as HTML error pages with HTTP 200 rather than HTTP
        404.

        These source-defined HTTP 200 error-page outcomes are part of the rendered HTML contract and are documented in

        `responses.200.description` and `x-response-shaping`, not under `x-error-handling`.

        '
      operationId: getActionLinkPage
      security: []
      parameters:
      - in: query
        name: action
        required: true
        description: Action-link flow to execute.
        schema:
          type: string
          enum:
          - password_reset
          - sub_password_reset
          - email_verification
          - sub_email_verification
          - signup_verification
      - in: query
        name: id
        required: true
        description: Persisted action-link UUID.
        schema:
          type: string
          format: uuid
      x-actor:
        type: anonymous-user
        roles: []
        note: anonymous caller following an emailed action link
      x-validation:
        common:
        - the action-link record identified by query.id must exist before any action-specific page can be rendered
        passwordReset:
        - password_reset and sub_password_reset both use the same reset-password page flow in the current source
        emailVerification:
        - email_verification and sub_email_verification both use the same email-verification flow in the current source
        signupVerification:
        - signup_verification renders the subscriber-signup completion page and does not itself complete the signup; completion
          is performed by POST with action=signup_completion
      x-processing:
        sequence:
        - local:
            process: read action and id from the query string
          variables:
            action: query.action
            actionLinkId: query.id
        - service: postgres
          type: db
          schema: ../../db/schema/actions.sql
          action: selectOne
          condition:
            id: query.id == db.id
          output:
            actionLink: db.response
            actionLinkFound: db.response exists
        - conditional:
          - when: actionLinkFound == false
            sequence:
            - local:
                process: render the shared 404_error.html page and stop processing
          - when: action == password_reset or action == sub_password_reset
            sequence:
            - local:
                process: render password_reset.html using the action-link UUID and the normal password-validation expression
          - when: action == email_verification or action == sub_email_verification
            sequence:
            - conditional:
              - when: current time is greater than actionLink.expires
                sequence:
                - service: postgres
                  type: db
                  schema: ../../db/schema/actions.sql
                  action: update
                  condition:
                    id: query.id == db.id
                  input:
                    canceled: current time
                - local:
                    process: render the shared 404_error.html page and stop processing
              - when: current time is not greater than actionLink.expires
                sequence:
                - service: postgres
                  type: db
                  endpoint: GetLinkedUser
                  method: GET
                  requestMapping:
                    userAction: actionLink.userAction
                    userId: actionLink.userId
                  variables:
                    linkedUser: db.response
                    linkedUserFound: db.response exists
                - conditional:
                  - when: linkedUserFound == false
                    sequence:
                    - local:
                        process: render email_verification_error.html with the invalid-link message
                  - when: linkedUserFound == true
                    sequence:
                    - local:
                        process: mark the linked user as no longer waiting for email verification, set validated, update lastEmailCheck,
                          validationDate, and modified timestamps, and persist the user in the admin or subscriber table according
                          to actionLink.userAction
                    - service: postgres
                      type: db
                      schema: ../../db/schema/actions.sql
                      action: update
                      condition:
                        id: query.id == db.id
                      input:
                        completed: current time
                    - local:
                        process: render email_verification_success.html using the action-link UUID, linked user email, and
                          UI URI
          - when: action == signup_verification
            sequence:
            - local:
                process: render sub_signup_verification.html using the action-link UUID and the normal password-validation
                  expression
          - when: action is any other value
            sequence:
            - local:
                process: render the shared 404_error.html page and stop processing
      x-response-shaping:
        transformations:
        - return an HTML document in every current-source branch
        - return the rendered 404_error.html page with HTTP 200 for unsupported actions, missing links, and expired links
        - for successful password-reset and signup-verification GET flows, return the rendered HTML form page
        - for successful email-verification flows, return the rendered email-verification success or error HTML page according
          to linked-user resolution
      x-error-handling:
        local: {}
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      responses:
        '200':
          description: Rendered HTML page for the resolved action-link flow, including source-defined HTML error pages that
            are returned with HTTP 200.
          content:
            text/html:
              schema:
                type: string
              examples:
                passwordReset:
                  summary: Password reset form page
                  value: <html>...</html>
                notFoundPage:
                  summary: Rendered 404 error page returned with HTTP 200
                  value: <html>...</html>
    post:
      tags:
      - Action Links
      summary: Submit an action-link HTML form.
      description: 'Processes a submitted OWSEC action-link form.


        The inspected OWSEC source currently dispatches these POST actions:

        - `password_reset`

        - `sub_password_reset`

        - `signup_completion`

        - `email_invitation`


        `email_invitation` is exposed by the source router, but the invoked `CompleteEmailInvitation()` helper is a TODO stub
        in the inspected source. It does not read request data, mutate state, or explicitly write an HTTP response.

        Source-defined validation failures and unsupported actions are rendered as HTML pages with HTTP 200; those outcomes
        are documented in `responses.200.description` and `x-response-shaping`, not under `x-error-handling`.

        '
      operationId: submitActionLinkForm
      security: []
      parameters:
      - in: query
        name: action
        required: true
        description: Action-link form flow to execute. `email_invitation` is accepted by the source dispatcher but currently
          reaches a TODO stub with no explicit response.
        schema:
          type: string
          enum:
          - password_reset
          - sub_password_reset
          - signup_completion
          - email_invitation
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required:
              - id
              - password1
              - password2
              properties:
                id:
                  type: string
                  format: uuid
                password1:
                  type: string
                password2:
                  type: string
          multipart/form-data:
            schema:
              type: object
              required:
              - id
              - password1
              - password2
              properties:
                id:
                  type: string
                  format: uuid
                password1:
                  type: string
                password2:
                  type: string
      x-actor:
        type: anonymous-user
        roles: []
        note: anonymous caller submitting an emailed action-link form
      x-validation:
        common:
        - the submitted form must not be empty for password-reset and signup-completion flows
        - the action-link record identified by form.id must exist for password-reset and signup-completion flows
        - expired links are canceled before the HTML error page is returned
        passwordReset:
        - password_reset and sub_password_reset both execute the same reset-password completion flow in the current source
        - password1 and password2 must match
        - both submitted passwords must satisfy the normal password-validation rule in the reset-password completion flow,
          even for sub_password_reset
        signupCompletion:
        - password1 and password2 must match
        - signup_completion validates password1 with the subscriber password-validation rule
        emailInvitation:
        - email_invitation is accepted by the source dispatcher but the invoked helper is a TODO stub with no implemented
          validation, state mutation, or explicit response
      x-processing:
        sequence:
        - local:
            process: read action from the query string and parse the submitted HTML form for implemented form-backed flows
          variables:
            action: query.action
            formPresent: request.form is not empty
            actionLinkId: request.form.id
            password1: request.form.password1
            password2: request.form.password2
        - conditional:
          - when: formPresent == false and action != email_invitation
            sequence:
            - local:
                process: render the shared 404_error.html page and stop processing
          - when: action == password_reset or action == sub_password_reset
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/actions.sql
              action: selectOne
              condition:
                id: request.form.id == db.id
              output:
                actionLink: db.response
                actionLinkFound: db.response exists
            - conditional:
              - when: actionLinkFound == false
                sequence:
                - local:
                    process: render the shared 404_error.html page and stop processing
              - when: current time is greater than actionLink.expires
                sequence:
                - service: postgres
                  type: db
                  schema: ../../db/schema/actions.sql
                  action: update
                  condition:
                    id: request.form.id == db.id
                  input:
                    canceled: current time
                - local:
                    process: render the shared 404_error.html page and stop processing
              - when: password1 != password2 or password1 fails the normal password-validation rule or password2 fails the
                  normal password-validation rule
                sequence:
                - local:
                    process: render password_reset_error.html with the password-policy error text
              - when: password1 == password2 and both passwords satisfy the normal password-validation rule
                sequence:
                - conditional:
                  - when: actionLink.userAction == true
                    sequence:
                    - service: postgres
                      type: db
                      schema: ../../db/schema/users.sql
                      action: selectOne
                      condition:
                        id: actionLink.userId == db.id
                      output:
                        linkedUser: db.response
                        linkedUserFound: db.response exists
                  - when: actionLink.userAction != true
                    sequence:
                    - service: postgres
                      type: db
                      schema: ../../db/schema/subscribers.sql
                      action: selectOne
                      condition:
                        id: actionLink.userId == db.id
                      output:
                        linkedUser: db.response
                        linkedUserFound: db.response exists
                - conditional:
                  - when: linkedUserFound == false
                    sequence:
                    - local:
                        process: render password_reset_error.html with the invalid-user message
                  - when: linkedUser.blackListed == true or linkedUser.suspended == true
                    sequence:
                    - local:
                        process: render password_reset_error.html with the account-error message
                  - when: setting the new password is rejected because it reuses a recent password
                    sequence:
                    - local:
                        process: render password_reset_error.html with the password-reuse message
                  - when: linkedUserFound == true and linkedUser.blackListed == false and linkedUser.suspended == false and
                      the new password is accepted
                    sequence:
                    - local:
                        process: apply the accepted new password to the linked user according to whether this action link
                          targets an admin user or a subscriber, then set `linkedUser.modified` to the current timestamp
                    - conditional:
                      - when: actionLink.userAction == true
                        sequence:
                        - service: postgres
                          type: db
                          schema: ../../db/schema/users.sql
                          action: update
                          condition:
                            id: actionLink.userId == db.id
                          input:
                            user: linkedUser
                      - when: actionLink.userAction != true
                        sequence:
                        - service: postgres
                          type: db
                          schema: ../../db/schema/subscribers.sql
                          action: update
                          condition:
                            id: actionLink.userId == db.id
                          input:
                            subscriber: linkedUser
                    - service: postgres
                      type: db
                      schema: ../../db/schema/actions.sql
                      action: update
                      condition:
                        id: request.form.id == db.id
                      input:
                        completed: current time
                    - local:
                        process: render password_reset_success.html using the linked user email and UI URI
          - when: action == signup_completion
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/actions.sql
              action: selectOne
              condition:
                id: request.form.id == db.id
              output:
                actionLink: db.response
                actionLinkFound: db.response exists
            - conditional:
              - when: actionLinkFound == false
                sequence:
                - local:
                    process: render the shared 404_error.html page and stop processing
              - when: current time is greater than actionLink.expires
                sequence:
                - service: postgres
                  type: db
                  schema: ../../db/schema/actions.sql
                  action: update
                  condition:
                    id: request.form.id == db.id
                  input:
                    canceled: current time
                - local:
                    process: render the shared 404_error.html page and stop processing
              - when: password1 != password2 or password1 fails the subscriber password-validation rule
                sequence:
                - local:
                    process: render sub_password_reset_error.html with the password-policy error text
              - when: password1 == password2 and password1 satisfies the subscriber password-validation rule
                sequence:
                - service: postgres
                  type: db
                  schema: ../../db/schema/subscribers.sql
                  action: selectOne
                  condition:
                    id: actionLink.userId == db.id
                  output:
                    subscriberUser: db.response
                    subscriberUserFound: db.response exists
                - conditional:
                  - when: subscriberUserFound == false
                    sequence:
                    - local:
                        process: render sub_signup_verification_error.html with the invalid-user message
                  - when: subscriberUser.blackListed == true or subscriberUser.suspended == true
                    sequence:
                    - local:
                        process: render sub_signup_verification_error.html with the account-error message
                  - when: setting the new subscriber password is rejected because it reuses a recent password
                    sequence:
                    - local:
                        process: render sub_signup_verification_error.html with the password-reuse message
                  - when: subscriberUserFound == true and subscriberUser.blackListed == false and subscriberUser.suspended
                      == false and the new subscriber password is accepted
                    sequence:
                    - local:
                        process: set the subscriber password in memory, clear `changePassword` and `waitingForEmailCheck`,
                          update `lastEmailCheck`, `validated`, and `modified`
                    - service: postgres
                      type: db
                      schema: ../../db/schema/subscribers.sql
                      action: update
                      condition:
                        id: actionLink.userId == db.id
                      input:
                        subscriber: subscriberUser
                    - service: postgres
                      type: db
                      schema: ../../db/schema/actions.sql
                      action: update
                      condition:
                        id: request.form.id == db.id
                      input:
                        completed: current time
                    - service: owprov
                      type: https
                      endpoint: /api/v1/subscriber
                      method: PUT
                      requestMapping:
                        signupUUID: subscriberUser.signingUp token after optional colon split
                        operation: emailVerified
                      variables:
                        provisioningStatus: http.status
                    - local:
                        process: render sub_signup_verification_success.html using the action-link UUID and subscriber email
                          regardless of whether the provisioning notification succeeds
          - when: action == email_invitation
            sequence:
            - local:
                process: enter CompleteEmailInvitation TODO stub; current source performs no validation, no state mutation,
                  no downstream call, and no explicit response write
          - when: action is any other value
            sequence:
            - local:
                process: render the shared 404_error.html page and stop processing
      x-response-shaping:
        transformations:
        - return an HTML document in every implemented current-source branch
        - return rendered HTML error pages with HTTP 200 for empty forms, missing links, expired links, password mismatches,
          password-policy failures, invalid users, suspended or blacklisted users, password-reuse rejection, and unsupported
          actions
        - return password_reset_success.html after successful password reset completion
        - return sub_signup_verification_success.html after successful signup completion even when the downstream owprov notification
          fails
        - email_invitation currently reaches a TODO stub and has no explicit response body or status in the source
      x-error-handling:
        local: {}
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      x-idempotency:
        enabled: false
        mode: command
        note: Repeat submissions are not idempotent in the implemented source flows. A successful password-reset or signup-completion
          POST can mutate password state again while the action-link record still exists and remains unexpired, and signup-completion
          always re-attempts the owprov notification. The email_invitation branch is currently a no-op TODO stub.
      responses:
        '200':
          description: Rendered HTML page for implemented submitted action-link flows, including source-defined HTML success
            and error pages returned with HTTP 200.
          content:
            text/html:
              schema:
                type: string
              examples:
                resetSuccess:
                  summary: Password reset success page
                  value: <html>...</html>
                signupSuccess:
                  summary: Subscriber signup completion success page
                  value: <html>...</html>
                errorPage:
                  summary: Rendered HTML error page
                  value: <html>...</html>
        default:
          description: The exposed `email_invitation` action reaches a TODO stub in the current source and does not explicitly
            write a response body or status.
  /apiKey/{uuid}:
    get:
      tags:
      - API Keys
      summary: List API keys for one user.
      description: Returns up to 500 API-key records for the target user UUID. The current source sanitizes each returned
        record by clearing `salt` before serialization, but still returns the actual `apiKey` value.
      operationId: getApiKeys
      parameters:
      - in: path
        name: uuid
        required: true
        description: User UUID whose API keys should be listed.
        schema:
          type: string
          format: uuid
      x-actor:
        type: authenticated-user
        roles:
        - user
        - root
        note: authenticated user requesting their own API keys, or authenticated root user requesting another user's API keys
      x-validation:
        common:
        - path uuid must be present
        - caller must be root or must match the path uuid
      x-processing:
        sequence:
        - local:
            process: read the target user UUID from the path and compare it with the authenticated user
          variables:
            targetUserUuid: path.uuid
            callerUserUuid: token.userinfo.id
            callerRole: token.userinfo.userRole
        - local:
            process: reject the request when targetUserUuid is empty or when the caller is neither root nor the same user
        - service: postgres
          type: db
          schema: ../../db/schema/apikeys.sql
          action: selectMany
          condition:
            useruuid: path.uuid == db.useruuid
          input:
            offset: 0
            limit: 500
          output:
            apiKeys: db.response
            fetchSucceeded: db.result.success
        - conditional:
          - when: fetchSucceeded == true
            sequence:
            - local:
                process: sanitize each returned API-key record by clearing salt before serialization
      x-response-shaping:
        transformations:
        - return the `apiKeys` array wrapper serialized by ApiKeyEntryList
        - include `id`, `userUuid`, `name`, `apiKey`, `description`, `expiresOn`, `rights`, `lastUse`, and sanitized empty
          `salt` for each returned item
        - do not include the internal `created` field because ApiKeyEntry::to_json does not serialize it
      x-error-handling:
        local:
          '400':
          - path uuid is missing or invalid
          '403':
          - caller is neither root nor the same user identified by the path uuid
          '404':
          - API-key lookup does not produce a record set in the current database path
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      responses:
        '200':
          description: API keys returned successfully.
          content:
            application/json:
              schema:
                type: object
                description: Response wrapper containing API-key records.
                additionalProperties: false
                required:
                - apiKeys
                properties:
                  apiKeys:
                    type: array
                    description: API-key records returned by the list operation.
                    items:
                      type: object
                      description: Stored API-key record returned by the API-key handlers.
                      additionalProperties: false
                      required:
                      - id
                      - userUuid
                      - name
                      - apiKey
                      - salt
                      - description
                      - expiresOn
                      - rights
                      - lastUse
                      properties:
                        id:
                          type: string
                          format: uuid
                          description: API-key record UUID.
                        userUuid:
                          type: string
                          format: uuid
                          description: UUID of the user who owns the API key.
                        name:
                          type: string
                          description: Human-readable API-key name.
                        apiKey:
                          type: string
                          description: API-key value or stored key material as emitted by the current handler.
                        salt:
                          type: string
                          description: Salt associated with the stored API-key material.
                        description:
                          type: string
                          description: Human-readable API-key description.
                        expiresOn:
                          type: integer
                          format: int64
                          description: Expiration timestamp for the API key.
                        rights:
                          allOf:
                          - type: object
                            description: Container for all access-control entries assigned to an API key.
                            additionalProperties: false
                            required:
                            - acls
                            properties:
                              acls:
                                type: array
                                description: Ordered list of API-key ACL entries.
                                items:
                                  type: object
                                  description: One API-key access-control entry describing the target service and the access
                                    level granted for that service.
                                  additionalProperties: false
                                  properties:
                                    service:
                                      type: string
                                      description: Service name or service identifier to which this ACL entry applies.
                                    access:
                                      type: string
                                      description: Access level granted for the service.
                          description: Access rights assigned to this API key.
                        lastUse:
                          type: integer
                          format: int64
                          description: Timestamp of the last recorded API-key use.
              examples:
                list:
                  value:
                    apiKeys:
                    - id: 11111111-2222-3333-4444-555555555555
                      userUuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                      name: ci-reader
                      apiKey: 4f9d1e3f7b...
                      salt: ''
                      description: CI read-only key
                      expiresOn: 1767225600
                      rights:
                        acls:
                        - service: owprov
                          access: read
                      lastUse: 0
        '400':
          description: Missing or invalid parameters.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No API-key records returned by the current database path.
          content:
            application/json:
              schema:
                type: object
    post:
      tags:
      - API Keys
      summary: Create an API key for one user.
      description: 'Creates a new API key for the target user UUID. The current source accepts a broad ApiKeyEntry JSON shape,
        but only `name`, `description`, `expiresOn`, and `rights` are meaningful inputs because `id`, `userUuid`, `salt`,
        `apiKey`, `created`, and `lastUse` are derived or overwritten server-side.


        Request-body note: only `name`, `description`, `expiresOn`, and `rights` influence the created key. The source parser
        accepts the full ApiKeyEntry shape, but server logic overwrites `id`, `userUuid`, `salt`, `apiKey`, and `lastUse`.

        '
      operationId: createApiKey
      parameters:
      - in: path
        name: uuid
        required: true
        description: User UUID that will own the new API key.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Request body accepted by the API-key create flow before server-side fields are overwritten.
              additionalProperties: true
              properties:
                id:
                  type: string
                  format: uuid
                  description: Parsed if present but overwritten server-side.
                userUuid:
                  type: string
                  format: uuid
                  description: Parsed if present but overwritten with the path uuid.
                name:
                  type: string
                  description: Human-readable API-key name supplied by the caller.
                apiKey:
                  type: string
                  description: Parsed if present but overwritten server-side.
                salt:
                  type: string
                  description: Parsed if present but overwritten server-side.
                description:
                  type: string
                  description: Human-readable API-key description supplied by the caller.
                expiresOn:
                  type: integer
                  format: int64
                  description: Parsed if present by the source model.
                rights:
                  allOf:
                  - type: object
                    description: Container for all access-control entries assigned to an API key.
                    additionalProperties: false
                    required:
                    - acls
                    properties:
                      acls:
                        type: array
                        description: Ordered list of API-key ACL entries.
                        items:
                          type: object
                          description: One API-key access-control entry describing the target service and the access level
                            granted for that service.
                          additionalProperties: false
                          properties:
                            service:
                              type: string
                              description: Service name or service identifier to which this ACL entry applies.
                            access:
                              type: string
                              description: Access level granted for the service.
                  description: Parsed API-key access rights supplied by the caller.
                lastUse:
                  type: integer
                  format: int64
                  description: Parsed if present but reset to zero before persistence.
      x-actor:
        type: authenticated-user
        roles:
        - user
        - root
        note: authenticated user creating their own API key, or authenticated root user creating an API key for another user
      x-validation:
        common:
        - path uuid must be present
        - caller must be root or must match the path uuid
        - when the caller is root and the target user differs from the caller, the target user must exist
        - request body must parse as ApiKeyEntry JSON
        apiKey:
        - name must be non-empty and strictly alphanumeric
        - name is lowercased before duplicate detection and persistence
        - expiresOn must be greater than the current time
        - the target user must not already have an API key with the same lowercased name among the first 500 fetched keys
        - the target user must not already have 10 or more API keys among the first 500 fetched keys
      x-processing:
        sequence:
        - local:
            process: read the target user UUID from the path, parse the request body as ApiKeyEntry, and compare the target
              with the authenticated user
          variables:
            targetUserUuid: path.uuid
            callerUserUuid: token.userinfo.id
            callerAccessToken: token.webtoken.access_token
            callerRole: token.userinfo.userRole
            incomingApiKey: request.body
        - local:
            process: reject the request when targetUserUuid is empty or when the caller is neither root nor the same user
        - service: postgres
          type: db
          schema: ../../db/schema/users.sql
          action: exists
          when: targetUserUuid != callerUserUuid
          condition:
            id: path.uuid == db.id
          output:
            targetUserExists: db.response
        - conditional:
          - when: targetUserUuid != callerUserUuid and targetUserExists == false
            sequence:
            - local:
                process: reject the request because the target user does not exist
          - when: targetUserUuid == callerUserUuid or targetUserExists == true
            sequence: []
        - local:
            process: normalize incomingApiKey.name to lowercase, set lastUse to 0, and reject the request when name is empty,
              name is not alphanumeric, or expiresOn is not in the future
        - service: postgres
          type: db
          schema: ../../db/schema/apikeys.sql
          action: selectMany
          condition:
            useruuid: path.uuid == db.useruuid
          input:
            offset: 0
            limit: 500
          output:
            existingApiKeys: db.response
        - local:
            process: reject the request when an existing key already has the same lowercased name or when the fetched key
              count is already 10 or more
        - local:
            process: generate a new UUID, set userUuid from the path, set salt to the current timestamp string, compute apiKey
              as hash(salt, callerUserUuid, callerAccessToken), and set created to the current timestamp
          variables:
            persistedApiKey: local.result.persistedApiKey
        - service: postgres
          type: db
          schema: ../../db/schema/apikeys.sql
          action: insert
          input:
            apiKey: persistedApiKey
          output:
            createSucceeded: db.result.success
      x-response-shaping:
        transformations:
        - return the created ApiKeyEntry serialized directly from the in-memory object after persistence
        - include `salt` and the generated `apiKey` in the success response
        - do not include the internal `created` field because ApiKeyEntry::to_json does not serialize it
      x-error-handling:
        local:
          '400':
          - path uuid is missing or invalid
          - target user does not exist when creating for another user
          - request body does not parse as ApiKeyEntry JSON
          - name is empty or not alphanumeric
          - expiresOn is not in the future
          - duplicate lowercase key name already exists for the target user
          - target user already has 10 or more API keys in the fetched set
          - persistence fails and the record is not created
          '403':
          - caller is neither root nor the same user identified by the path uuid
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
      x-idempotency:
        enabled: false
        mode: create
        keyFields:
        - path.uuid
        - body.name
        onRepeat:
          duplicateNameRejected: true
          differentNamesCreateDistinctKeys: true
        note: Repeat create requests with the same lowercased name are rejected as duplicate. Successful creates require distinct
          names and produce distinct generated UUID, salt, and apiKey values until the per-user key limit is reached.
      responses:
        '200':
          description: API key created successfully.
          content:
            application/json:
              schema:
                type: object
                description: Stored API-key record returned by the API-key handlers.
                additionalProperties: false
                required:
                - id
                - userUuid
                - name
                - apiKey
                - salt
                - description
                - expiresOn
                - rights
                - lastUse
                properties:
                  id:
                    type: string
                    format: uuid
                    description: API-key record UUID.
                  userUuid:
                    type: string
                    format: uuid
                    description: UUID of the user who owns the API key.
                  name:
                    type: string
                    description: Human-readable API-key name.
                  apiKey:
                    type: string
                    description: API-key value or stored key material as emitted by the current handler.
                  salt:
                    type: string
                    description: Salt associated with the stored API-key material.
                  description:
                    type: string
                    description: Human-readable API-key description.
                  expiresOn:
                    type: integer
                    format: int64
                    description: Expiration timestamp for the API key.
                  rights:
                    allOf:
                    - type: object
                      description: Container for all access-control entries assigned to an API key.
                      additionalProperties: false
                      required:
                      - acls
                      properties:
                        acls:
                          type: array
                          description: Ordered list of API-key ACL entries.
                          items:
                            type: object
                            description: One API-key access-control entry describing the target service and the access level
                              granted for that service.
                            additionalProperties: false
                            properties:
                              service:
                                type: string
                                description: Service name or service identifier to which this ACL entry applies.
                              access:
                                type: string
                                description: Access level granted for the service.
                    description: Access rights assigned to this API key.
                  lastUse:
                    type: integer
                    format: int64
                    description: Timestamp of the last recorded API-key use.
              examples:
                created:
                  value:
                    id: 11111111-2222-3333-4444-555555555555
                    userUuid: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                    name: ci-reader
                    apiKey: 4f9d1e3f7b...
                    salt: '1760000000'
                    description: CI read-only key
                    expiresOn: 1767225600
                    rights:
                      acls:
                      - service: owprov
                        access: read
                    lastUse: 0
        '400':
          description: API key creation request rejected.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Access denied.
          content:
            application/json:
              schema:
                type: object
