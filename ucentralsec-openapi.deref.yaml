                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
    put:
      tags:
      - Subscriber MFA
      summary: Update the authenticated subscriber MFA configuration.
      description: Updates the authenticated subscriber MFA settings using a `SubMfaConfig` request body.
      operationId: updateSubscriberMfaConfig
      parameters:
      - in: query
        name: startValidation
        required: false
        description: When the query value is exactly lowercase `true` with `body.type=sms`, start an SMS validation challenge
          instead of persisting MFA settings. Any other value, including invalid boolean text, is parsed as false.
        schema:
          type: boolean
          default: false
      - in: query
        name: completeValidation
        required: false
        description: When the query value is exactly lowercase `true` with `body.type=sms`, complete an SMS validation challenge
          and persist the verified number. Any other value, including invalid boolean text, is parsed as false.
        schema:
          type: boolean
          default: false
      - in: query
        name: challengeCode
        required: false
        description: Challenge code consumed only when `completeValidation=true` with `body.type=sms`.
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              required:
              - type
              properties:
                id:
                  type: string
                type:
                  type: string
                  enum:
                  - disabled
                  - email
                  - sms
                  description: Source implements exact `disabled`, `email`, and `sms` branches. Missing or unsupported values
                    fall through to bad request.
                sms:
                  type: string
                  description: Required by source only for `type=sms` validation-start and validation-complete branches.
                email:
                  type: string
                  description: Parsed if present, but successful email and SMS-complete branches overwrite the response email
                    with the authenticated caller email.
            examples:
              disable:
                value:
                  id: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                  type: disabled
                  sms: ''
                  email: ''
              email:
                value:
                  id: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                  type: email
                  sms: ''
                  email: subscriber@example.com
              sms:
                value:
                  id: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                  type: sms
                  sms: '+15555550123'
                  email: ''
      x-actor:
        type: authenticated-subscriber
        roles:
        - subscriber
        note: subscriber-only route; authentication is required
      x-idempotency:
        enabled: false
        mode: command
        note: The disabled and email branches overwrite subscriber MFA state, while the SMS validation branches trigger validation
          side effects and may mutate stored phone data. The current source does not expose an idempotency key or repeat-detection
          mechanism.
      x-validation:
        common:
        - authentication is required
        - the route is subscriber-only
        - the request body must parse as `SubMfaConfig`
        disabled:
        - when `body.type=disabled`, the handler invokes `SubDB().GetUserById(...)` but does not check whether it succeeded
          before mutating the loaded object
        - when `body.type=disabled`, the handler disables subscriber MFA without checking the `SubDB().UpdateUserInfo(...)`
          result
        email:
        - when `body.type=email`, the handler invokes `SubDB().GetUserById(...)` but does not check whether it succeeded before
          mutating the loaded object
        - when `body.type=email`, the handler enables subscriber MFA with method `email`
        - the successful response for `body.type=email` overwrites `email` with the authenticated caller email and overwrites
          `id` with a newly generated UUID instead of the persisted subscriber id
        smsStart:
        - when `body.type=sms` and `startValidation=true`, `body.sms` must be non-empty
        - when `body.type=sms` and `startValidation=true`, SMS support must be enabled
        smsComplete:
        - when `body.type=sms`, `completeValidation=true`, and `startValidation` is not exactly true, SMS support must be
          enabled
        - when `body.type=sms`, `completeValidation=true`, and `startValidation` is not exactly true, `query.challengeCode`
          must be non-empty
        - when `body.type=sms`, `completeValidation=true`, and `startValidation` is not exactly true, `body.sms` must be non-empty
        - when `body.type=sms`, `completeValidation=true`, and `startValidation` is not exactly true, the handler invokes
          `SubDB().GetUserById(...)` but does not check whether it succeeded before mutating the loaded object
        - a successful sms-complete branch replaces subscriber mobiles with one verified primary phone number from `body.sms`
        fallthrough:
        - any request body that parses successfully but does not match `disabled`, `email`, `sms+startValidation`, or `sms+completeValidation`
          falls through to missing or invalid parameters
      x-processing:
        sequence:
        - local:
            process: parse the request body as `SubMfaConfig` and read optional SMS control query parameters
          variables:
            requestedConfig: request.body
            startValidation: query.startValidation parsed as boolean with default false
            completeValidation: query.completeValidation parsed as boolean with default false
            challengeCode: query.challengeCode
            callerId: token.userinfo.id
            callerEmail: token.userinfo.email
        - conditional:
          - when: request body does not parse as `SubMfaConfig`
            sequence:
            - local:
                process: return invalid JSON document
          - when: requestedConfig.type == disabled
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/subscribers.sql
              action: selectOne
              condition:
                id: token.userinfo.id == db.id
              output:
                subscriber: db.response
            - local:
                process: invoke `SubDB().GetUserById(...)` without checking whether it succeeded and set subscriber.userTypeProprietaryInfo.mfa.enabled
                  to false
            - service: postgres
              type: db
              schema: ../../db/schema/subscribers.sql
              action: update
              condition:
                id: token.userinfo.id == db.id
              input:
                subscriber: subscriber
            - local:
                process: return the parsed `SubMfaConfig` request object as the response body
          - when: requestedConfig.type == email
            sequence:
            - service: postgres
              type: db
              schema: ../../db/schema/subscribers.sql
              action: selectOne
              condition:
                id: token.userinfo.id == db.id
              output:
                subscriber: db.response
            - local:
                process: invoke `SubDB().GetUserById(...)` without checking whether it succeeded, set subscriber.userTypeProprietaryInfo.mfa.enabled
                  to true, and set method to `email`
            - service: postgres
              type: db
              schema: ../../db/schema/subscribers.sql
              action: update
              condition:
                id: token.userinfo.id == db.id
              input:
                subscriber: subscriber
            - local:
                process: overwrite response sms with its current value, overwrite response type with `email`, overwrite response
                  email with callerEmail, and overwrite response id with a newly generated UUID
          - when: requestedConfig.type == sms and startValidation == true
            sequence:
            - conditional:
              - when: requestedConfig.sms is empty
                sequence:
                - local:
                    process: return missing phone number
              - when: requestedConfig.sms is not empty
                sequence:
                - local:
                    process: evaluate whether SMS support is enabled
                  variables:
                    smsEnabled: local.result.enabled
                - conditional:
                  - when: smsEnabled == false
                    sequence:
                    - local:
                        process: return bad request because SMS MFA is not enabled
                  - when: smsEnabled == true
                    sequence:
                    - local:
                        process: call the in-process SMS sender to start validation for requestedConfig.sms using callerEmail
                      variables:
                        validationStarted: local.result.success
                    - conditional:
                      - when: validationStarted == true
                        sequence:
                        - local:
                            process: return the standard HTTP 200 OK helper payload
                      - when: validationStarted == false
                        sequence:
                        - local:
                            process: return internal error with try later
          - when: requestedConfig.type == sms and startValidation != true and completeValidation == true
            sequence:
            - local:
                process: evaluate whether SMS support is enabled
              variables:
                smsEnabled: local.result.enabled
            - conditional:
              - when: smsEnabled == false
                sequence:
                - local:
                    process: return bad request because SMS MFA is not enabled
              - when: smsEnabled == true
                sequence:
                - conditional:
                  - when: challengeCode is empty
                    sequence:
                    - local:
                        process: return missing challenge code
                  - when: challengeCode is not empty and requestedConfig.sms is empty
                    sequence:
                    - local:
                        process: return missing phone number
                  - when: challengeCode is not empty and requestedConfig.sms is not empty
                    sequence:
                    - local:
                        process: call the in-process SMS sender to complete validation for requestedConfig.sms using challengeCode
                          and callerEmail
                      variables:
                        validationCompleted: local.result.success
                    - conditional:
                      - when: validationCompleted == true
                        sequence:
                        - service: postgres
                          type: db
                          schema: ../../db/schema/subscribers.sql
                          action: selectOne
                          condition:
                            id: token.userinfo.id == db.id
                          output:
                            subscriber: db.response
                        - local:
                            process: invoke `SubDB().GetUserById(...)` without checking whether it succeeded, set subscriber.userTypeProprietaryInfo.mfa.enabled
                              to true, set method to `sms`, and replace mobiles with one verified primary phone number from
                              requestedConfig.sms
                        - service: postgres
                          type: db
                          schema: ../../db/schema/subscribers.sql
                          action: update
                          condition:
                            id: token.userinfo.id == db.id
                          input:
                            subscriber: subscriber
                        - local:
                            process: overwrite response sms with its current value, overwrite response type with `sms`, overwrite
                              response email with callerEmail, and overwrite response id with a newly generated UUID
                      - when: validationCompleted == false
                        sequence:
                        - local:
                            process: return internal error with try later
          - when: requestedConfig.type is any other value, or requestedConfig.type == sms without startValidation or completeValidation
            sequence:
            - local:
                process: return missing or invalid parameters
      x-response-shaping:
        transformations:
        - GET and successful state-changing PUT branches return a serialized `SubMfaConfig` object with `id`, `type`, `sms`,
          and `email`
        - the `disabled` PUT branch returns the parsed request body unchanged
        - the `email` and successful `sms` complete-validation PUT branches overwrite `id` with a fresh UUID instead of returning
          the persisted subscriber id
        - the `email` and successful `sms` complete-validation PUT branches overwrite `email` with the authenticated caller
          email
        - the successful `sms` start-validation branch returns the standard `OK()` JSON helper payload rather than a `SubMfaConfig`
          object
      x-error-handling:
        local:
          '400':
          - the request body does not parse as `SubMfaConfig`
          - '`body.type=sms` start validation is requested without a phone number'
          - '`body.type=sms` complete validation is requested without `challengeCode`'
          - '`body.type=sms` complete validation is requested without a phone number'
          - SMS MFA is not enabled for an SMS branch
          - the request does not match any supported branch and falls through to missing or invalid parameters
          '403':
          - authentication fails
          - the caller is not a subscriber
          '500':
          - SMS start validation fails
          - SMS completion validation fails
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The route is subscriber-only and requires authentication. Several successful branches invoke `SubDB().GetUserById(...)`
          and `SubDB().UpdateUserInfo(...)` without checking those results before returning success.
      responses:
        '200':
          description: Subscriber MFA action completed successfully.
          content:
            application/json:
              schema:
                oneOf:
                - type: object
                  additionalProperties: false
                  required:
                  - id
                  - type
                  - sms
                  - email
                  properties:
                    id:
                      type: string
                    type:
                      type: string
                    sms:
                      type: string
                    email:
                      type: string
                - type: object
                  additionalProperties: false
                  required:
                  - Code
                  - Operation
                  - Details
                  properties:
                    Code:
                      type: integer
                      enum:
                      - 0
                    Operation:
                      type: string
                    Details:
                      type: string
              examples:
                disabled:
                  value:
                    id: aaaaaaaa-bbbb-cccc-dddd-eeeeeeeeeeee
                    type: disabled
                    sms: ''
                    email: ''
                email:
                  value:
                    id: 11111111-2222-3333-4444-555555555555
                    type: email
                    sms: ''
                    email: subscriber@example.com
                smsComplete:
                  value:
                    id: 11111111-2222-3333-4444-555555555555
                    type: sms
                    sms: '+15555550123'
                    email: subscriber@example.com
                smsStart:
                  value:
                    Code: 0
                    Operation: PUT
                    Details: Command completed.
        '400':
          description: Invalid subscriber MFA request.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '403':
          description: Authentication failed or caller is not a subscriber.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
        '500':
          description: SMS validation action failed after reaching the SMS sender.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - ErrorCode
                - ErrorDetails
                - ErrorDescription
                properties:
                  ErrorCode:
                    type: integer
                  ErrorDetails:
                    type: string
                  ErrorDescription:
                    type: string
  /suboauth2:
    get:
      tags:
      - Subscriber OAuth2
      summary: Return the current caller profile for the `me` flow.
      description: Returns the current authorized caller profile when `me=true`. Any other `GET /suboauth2` request is rejected
        as unrecognized.
      operationId: getSubscriberOauth2Profile
      security:
      - bearerAuth: []
      - ApiKeyAuth: []
      parameters:
      - in: query
        name: me
        required: false
        description: Only the exact lowercase boolean value `true` selects the profile-return flow. Missing, invalid, or any
          other boolean value behaves as false.
        schema:
          type: boolean
          default: false
      x-actor:
        type: explicitly-authorized-caller
        roles:
        - subscriber
        note: The handler performs explicit authorization inside `DoGet()` instead of relying on constructor-level automatic
          auth. The shared authorization helper is invoked with `Sub=true`.
      x-validation:
        common:
        - authorization is performed before any `me` handling
        - only `query.me=true` is accepted
        authorization:
        - when authorization fails because the token is expired, the handler returns the expired-token unauthorized error
        - all other authorization failures return the invalid-token unauthorized error
      x-processing:
        sequence:
        - local:
            process: run the shared authorization helper with `Sub=true` before reading query flags
          variables:
            authorizedCaller: token.userinfo
            tokenExpired: auth.result.expired
            authContacted: auth.result.contacted
        - conditional:
          - when: authorization failed and tokenExpired == true
            sequence:
            - local:
                process: return unauthorized with expired-token
          - when: authorization failed and tokenExpired != true
            sequence:
            - local:
                process: return unauthorized with invalid-token
          - when: authorization succeeded and query.me == true
            sequence:
            - local:
                process: copy `UserInfo_.userinfo`, clear `currentPassword`, clear `lastPasswords`, clear `oauthType`, serialize
                  the full `UserInfo::to_json` shape, and return it
          - when: authorization succeeded and query.me != true
            sequence:
            - local:
                process: return bad request with unrecognized-request
      x-response-shaping:
        transformations:
        - successful `me` requests return the full `UserInfo::to_json` serializer output
        - before serialization, the handler clears `currentPassword`, `lastPasswords`, and `oauthType`
        - no additional response filtering is applied by this handler
      x-error-handling:
        local:
          '400':
          - authorization succeeded but `query.me` is not exactly true
          '403':
          - authorization fails with expired-token
          - authorization fails with invalid-token
        downstream:
          passthrough: false
        remap: []
      x-reliability:
        timeoutMs: 30000
        retries: 0
        note: The constructor does not enable automatic authorization or rate limiting for this route; `GET` enforces authorization
          manually inside the handler method.
      responses:
        '200':
          description: Sanitized caller profile returned successfully.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                description: Full `SecurityObjects::UserInfo::to_json` output after clearing `currentPassword`, `lastPasswords`,
                  and `oauthType`.
                required:
