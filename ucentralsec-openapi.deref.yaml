                - name
                - description
                - avatar
                - email
                - validated
                - validationEmail
                - validationDate
                - creationDate
                - validationURI
                - changePassword
                - lastLogin
                - currentLoginURI
                - lastPasswordChange
                - lastEmailCheck
                - waitingForEmailCheck
                - locale
                - notes
                - location
                - owner
                - suspended
                - blackListed
                - userRole
                - userTypeProprietaryInfo
                - securityPolicy
                - securityPolicyChange
                - currentPassword
                - lastPasswords
                - oauthType
                - oauthUserInfo
                - modified
                - signingUp
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  description:
                    type: string
                  avatar:
                    type: string
                  email:
                    type: string
                  validated:
                    type: boolean
                  validationEmail:
                    type: string
                  validationDate:
                    type: integer
                  creationDate:
                    type: integer
                  validationURI:
                    type: string
                  changePassword:
                    type: boolean
                  lastLogin:
                    type: integer
                  currentLoginURI:
                    type: string
                  lastPasswordChange:
                    type: integer
                  lastEmailCheck:
                    type: integer
                  waitingForEmailCheck:
                    type: boolean
                  locale:
                    type: string
                  notes:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required:
                      - created
                      - createdBy
                      - note
                      properties:
                        created:
                          type: integer
                        createdBy:
                          type: string
                        note:
                          type: string
                  location:
                    type: string
                  owner:
                    type: string
                  suspended:
                    type: boolean
                  blackListed:
                    type: boolean
                  userRole:
                    type: string
                    enum:
